id = "harness-policy"
description = "Hook and harness policy changes without product backend/frontend runtime checks."
aliases = ["harness-policy", "hook-policy", "harness-hook-policy"]
slice_patterns = ["stop-hook", "hook-policy", "harness-policy"]

[targets.backend]
prompt = "backend_execute.md"
allowed_scope = ".codex/hooks/**, .codex/harness/**"
forbidden_scope = "apps/property-data/**, apps/web/**, infra/**, docs/**"
verification_commands = [
  "python3 .codex/hooks/stop_verification_gate.py --self-test",
  "python3 .codex/hooks/pre_tool_use_policy.py --self-test",
  "python3 .codex/hooks/post_tool_use_review.py --self-test",
  "python3 .codex/harness/home_flow.py --self-test",
  "python3 .codex/harness/pr_lint.py --self-test",
  "git diff --check",
]

[safety]
allow_main_merge = false
allow_push = false
allow_open_api_call = false
allow_db_migration_run = false
