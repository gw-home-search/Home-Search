name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      ci_changed: ${{ steps.classify.outputs.ci_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only FETCH_HEAD HEAD > changed-files.txt
          else
            {
              echo ".github/workflows/ci.yml"
              echo "apps/api/"
              echo "apps/web/"
            } > changed-files.txt
          fi

          backend_changed=false
          frontend_changed=false
          ci_changed=false

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml)
                ci_changed=true
                ;;
              apps/api/*|apps/source-data/*|infra/*|docs/API_CONTRACT.md|docs/DATA_STORAGE.md|docs/INFRA_AND_ENV.md|settings.gradle|build.gradle|gradle.properties|gradle/*)
                backend_changed=true
                ;;
              apps/web/*)
                frontend_changed=true
                ;;
            esac
          done < changed-files.txt

          if [[ "$ci_changed" == "true" ]]; then
            backend_changed=true
            frontend_changed=true
          fi

          {
            echo "backend_changed=$backend_changed"
            echo "frontend_changed=$frontend_changed"
            echo "ci_changed=$ci_changed"
          } >> "$GITHUB_OUTPUT"

  test-display-name-policy:
    name: test-display-name-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test display name policy self-test
        run: python3 scripts/check-test-display-names.py --self-test
      - name: Check test display names
        run: python3 scripts/check-test-display-names.py

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run backend tests
        working-directory: apps/api
        run: ./gradlew backendQualityCheck --no-daemon --stacktrace
      - name: Upload backend quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-artifacts
          path: |
            apps/api/build/reports/tests/
            apps/api/build/reports/jacoco/
            apps/api/build/docs/asciidoc/
            apps/api/build/api-spec/openapi3.yaml
          if-no-files-found: ignore

  frontend-test-build:
    name: frontend-test-build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/web
        run: npm run test
      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  diff-check:
    name: diff-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi
