name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      source_data_changed: ${{ steps.classify.outputs.source_data_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      admin_service_changed: ${{ steps.classify.outputs.admin_service_changed }}
      admin_web_changed: ${{ steps.classify.outputs.admin_web_changed }}
      ai_changed: ${{ steps.classify.outputs.ai_changed }}
      chat_bff_changed: ${{ steps.classify.outputs.chat_bff_changed }}
      user_service_changed: ${{ steps.classify.outputs.user_service_changed }}
      infra_changed: ${{ steps.classify.outputs.infra_changed }}
      ml_changed: ${{ steps.classify.outputs.ml_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only FETCH_HEAD HEAD > changed-files.txt
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            git diff --name-only FETCH_HEAD HEAD > changed-files.txt
          else
            : > changed-files.txt
            args+=(--manual)
          fi
          .github/scripts/classify-changes.sh "${args[@]}" < changed-files.txt | tee -a "$GITHUB_OUTPUT"

      - name: Test change classifier
        run: |
          .github/scripts/test-classify-changes.sh
          .github/scripts/test-ci-main-trigger.sh
          .github/scripts/test-action-pinning.sh

  test-display-name-policy:
    name: test-display-name-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run test display name policy self-test
        run: python3 scripts/check-test-display-names.py --self-test
      - name: Check test display names
        run: python3 scripts/check-test-display-names.py

  event-contract-test:
    name: event-contract-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate event schemas, topics, and compatibility guard
        env:
          EVENT_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          .github/scripts/test-event-contracts.sh
          .github/scripts/test-event-contract-baseline.sh
          .github/scripts/test-staging-news-release-contract.sh
      - name: Verify release contract metadata
        run: .github/scripts/test-release-contract-metadata.sh

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run backend tests
        working-directory: apps/property-data
        run: ./gradlew backendQualityCheck --no-daemon --stacktrace
      - name: Upload backend quality artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-quality-artifacts
          path: |
            apps/property-data/core/build/reports/tests/
            apps/property-data/api/build/reports/tests/
            apps/property-data/build/reports/jacoco/
            apps/property-data/api/build/docs/asciidoc/
            apps/property-data/api/build/api-spec/openapi3.yaml
          if-no-files-found: ignore

  source-data-test:
    name: source-data-test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.source_data_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run source-data quality gate
        working-directory: apps/source-data
        run: ./gradlew sourceDataQualityCheck --no-daemon --stacktrace

  ai-service-test:
    name: ai-service-test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ai_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - name: Sync exact AI test dependencies
        working-directory: apps/ai
        run: uv sync --frozen --group test
      - name: Run AI service tests
        working-directory: apps/ai
        run: uv run pytest

  chat-bff-test:
    name: chat-bff-test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.chat_bff_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run chat BFF quality gate
        working-directory: apps/chat-bff
        run: ./gradlew chatBffQualityCheck --no-daemon --stacktrace

  frontend-test-build:
    name: frontend-test-build
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint
      - name: Run frontend tests
        working-directory: apps/web
        run: npm run test
      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  infra-contract-test:
    name: infra-contract-test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.infra_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify public gateway rate-limit contract
        run: |
          infra/nginx/test-property-public.sh
          infra/nginx/test-public-gateway-routing.sh
          infra/test-local-event-stack.sh
      - name: Verify deterministic backup fixture
        run: infra/backup/test-home-search-db-backup.sh
      - name: Verify PostgreSQL backup and ephemeral restore
        run: infra/backup/test-home-search-db-backup-integration.sh
      - name: Verify release eligibility and manifest scripts
        run: |
          .github/scripts/test-verify-release-eligibility.sh
          infra/release/test-create-release-manifest.sh
          infra/deploy/test-deploy-scripts.sh

  ml-image-test:
    name: ml-image-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ml_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build exact-lock ML image
        run: docker build --tag home-search-ml:ci apps/ml
      - name: Verify installed dependency graph
        run: docker run --rm --entrypoint python home-search-ml:ci -m pip check
      - name: Verify runtime imports without loading a model
        run: >-
          docker run --rm --entrypoint python home-search-ml:ci -c
          "import fastapi, h5py, keras, numpy, pydantic, tensorflow, uvicorn;
          import ml_service.main"
      - name: Verify non-root runtime and model exclusion
        shell: bash
        run: |
          set -euo pipefail
          user="$(docker inspect --format '{{.Config.User}}' home-search-ml:ci)"
          [[ "$user" == "10001:10001" ]]
          [[ "$(docker inspect --format '{{json .Config.Healthcheck.Test}}' home-search-ml:ci)" != "null" ]]
          docker run --rm --entrypoint python home-search-ml:ci -c \
            "from pathlib import Path; assert not Path('/model/keras_model.keras').exists(); assert not any(Path('/app').rglob('*.keras')); assert not any(Path('/app').rglob('*.h5'))"
      - name: Verify missing model fails before server startup
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm home-search-ml:ci; then
            echo "상태: Fail - model 없는 container가 성공 종료했습니다." >&2
            exit 1
          fi

  property-image-test:
    name: property-image-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify property workload image boundaries
        run: infra/images/test-property-images.sh

  platform-image-test:
    name: platform-image-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: >-
      needs.changes.outputs.admin_service_changed == 'true' ||
      needs.changes.outputs.user_service_changed == 'true' ||
      needs.changes.outputs.source_data_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify admin user and source-data image boundaries
        run: infra/images/test-platform-images.sh

  edge-image-test:
    name: edge-image-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend_changed == 'true' || needs.changes.outputs.admin_web_changed == 'true' || needs.changes.outputs.infra_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify public and admin gateway image boundaries
        run: infra/images/test-edge-images.sh

  image-manifest-test:
    name: image-manifest-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend_changed == 'true' || needs.changes.outputs.frontend_changed == 'true' || needs.changes.outputs.admin_service_changed == 'true' || needs.changes.outputs.admin_web_changed == 'true' || needs.changes.outputs.user_service_changed == 'true' || needs.changes.outputs.source_data_changed == 'true' || needs.changes.outputs.ml_changed == 'true' || needs.changes.outputs.infra_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify reproducible multi-image manifest
        run: infra/images/test-build-manifest.sh

  terraform-test:
    name: terraform-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.infra_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Verify Terraform roots
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate
          terraform -chdir=infra/terraform/bootstrap test
          terraform -chdir=infra/terraform/staging init -backend=false -input=false
          terraform -chdir=infra/terraform/staging validate
          terraform -chdir=infra/terraform/staging test

  admin-service-test:
    name: admin-service-test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.admin_service_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run admin service tests
        working-directory: apps/admin/service
        run: ./gradlew adminServiceQualityCheck --no-daemon --stacktrace

  admin-web-test-build:
    name: admin-web-test-build
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.admin_web_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/web/package-lock.json
      - name: Install admin web dependencies
        working-directory: apps/admin/web
        run: npm ci
      - name: Lint admin web
        working-directory: apps/admin/web
        run: npm run lint
      - name: Run admin web tests
        working-directory: apps/admin/web
        run: npm run test
      - name: Build admin web
        working-directory: apps/admin/web
        run: npm run build

  user-service-test:
    name: user-service-test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.user_service_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run user service tests
        working-directory: apps/user/service
        run: ./gradlew userServiceQualityCheck --no-daemon --stacktrace

  diff-check:
    name: diff-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi
