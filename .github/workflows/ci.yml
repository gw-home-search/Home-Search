name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      admin_service_changed: ${{ steps.classify.outputs.admin_service_changed }}
      admin_web_changed: ${{ steps.classify.outputs.admin_web_changed }}
      user_service_changed: ${{ steps.classify.outputs.user_service_changed }}
      infra_changed: ${{ steps.classify.outputs.infra_changed }}
      ci_changed: ${{ steps.classify.outputs.ci_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only FETCH_HEAD HEAD > changed-files.txt
          else
            {
              echo ".github/workflows/ci.yml"
              echo "apps/property-data/"
              echo "apps/web/"
              echo "apps/admin/service/"
              echo "apps/admin/web/"
              echo "apps/user/service/"
            } > changed-files.txt
          fi

          backend_changed=false
          frontend_changed=false
          admin_service_changed=false
          admin_web_changed=false
          user_service_changed=false
          infra_changed=false
          ci_changed=false

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml)
                ci_changed=true
                ;;
              apps/property-data/*|apps/source-data/*|docs/API_CONTRACT.md|docs/DATA_STORAGE.md|docs/INFRA_AND_ENV.md|settings.gradle|build.gradle|gradle.properties|gradle/*)
                backend_changed=true
                ;;
              infra/*)
                backend_changed=true
                infra_changed=true
                ;;
              apps/web/*)
                frontend_changed=true
                ;;
              apps/admin/service/*)
                admin_service_changed=true
                ;;
              apps/admin/web/*)
                admin_web_changed=true
                ;;
              libs/security-jwt-core/*)
                backend_changed=true
                admin_service_changed=true
                user_service_changed=true
                ;;
              apps/user/service/*|libs/user-auth-contract/*|docs/USER_SERVICE_PLAN.md)
                user_service_changed=true
                ;;
            esac
            case "$path" in
              infra/postgres/*|docs/INFRA_AND_ENV.md)
                user_service_changed=true
                ;;
            esac
          done < changed-files.txt

          if [[ "$ci_changed" == "true" ]]; then
            backend_changed=true
            frontend_changed=true
            admin_service_changed=true
            admin_web_changed=true
            user_service_changed=true
            infra_changed=true
          fi

          {
            echo "backend_changed=$backend_changed"
            echo "frontend_changed=$frontend_changed"
            echo "admin_service_changed=$admin_service_changed"
            echo "admin_web_changed=$admin_web_changed"
            echo "user_service_changed=$user_service_changed"
            echo "infra_changed=$infra_changed"
            echo "ci_changed=$ci_changed"
          } >> "$GITHUB_OUTPUT"

  test-display-name-policy:
    name: test-display-name-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test display name policy self-test
        run: python3 scripts/check-test-display-names.py --self-test
      - name: Check test display names
        run: python3 scripts/check-test-display-names.py

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run backend tests
        working-directory: apps/property-data
        run: ./gradlew backendQualityCheck --no-daemon --stacktrace
      - name: Upload backend quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-artifacts
          path: |
            apps/property-data/core/build/reports/tests/
            apps/property-data/api/build/reports/tests/
            apps/property-data/build/reports/jacoco/
            apps/property-data/api/build/docs/asciidoc/
            apps/property-data/api/build/api-spec/openapi3.yaml
          if-no-files-found: ignore

  frontend-test-build:
    name: frontend-test-build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/web
        run: npm run test
      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  nginx-contract-test:
    name: nginx-contract-test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Verify public gateway rate-limit contract
        run: infra/nginx/test-property-public.sh

  admin-service-test:
    name: admin-service-test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin_service_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run admin service tests
        working-directory: apps/admin/service
        run: ./gradlew spotlessCheck test persistenceTest apiContractTest securityTest --no-daemon --stacktrace

  admin-web-test-build:
    name: admin-web-test-build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin_web_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/web/package-lock.json
      - name: Install admin web dependencies
        working-directory: apps/admin/web
        run: npm ci
      - name: Run admin web tests
        working-directory: apps/admin/web
        run: npm run test
      - name: Build admin web
        working-directory: apps/admin/web
        run: npm run build

  user-service-test:
    name: user-service-test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.user_service_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run user service tests
        working-directory: apps/user/service
        run: ./gradlew userServiceQualityCheck --no-daemon --stacktrace

  diff-check:
    name: diff-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi
