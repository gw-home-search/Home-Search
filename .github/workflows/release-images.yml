name: Publish release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-immutable-images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare release failure evidence
        run: |
          set -Eeuo pipefail
          mkdir -p release-evidence
          jq -n \
            --arg release_tag "${GITHUB_REF_NAME}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            '{
              format_version: 1,
              release_tag: $release_tag,
              commit_sha: $commit_sha,
              workflow_run_id: $workflow_run_id
            }' >release-evidence/release-context.json

      - name: Verify main tag and successful quality gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" > check-runs.json
          .github/scripts/verify-release-eligibility.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" check-runs.json

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Log in to immutable ECR registry
        id: registry
        shell: bash
        run: |
          set -Eeuo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}" >/dev/null
          echo "registry=${registry}" >>"${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build and publish SHA and SemVer images
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          IMAGE_PREFIX: home-search
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
          SOURCE_URL: https://github.com/${{ github.repository }}
          KAKAO_MAP_APP_KEY: ${{ vars.KAKAO_MAP_APP_KEY }}
          MARKET_NEWS_ENABLED: ${{ vars.MARKET_NEWS_ENABLED || 'false' }}
        run: |
          set -Eeuo pipefail
          VERSION="${VERSION#v}"
          export VERSION
          [[ -n "${KAKAO_MAP_APP_KEY}" ]]
          [[ "${MARKET_NEWS_ENABLED}" == true ]]
          docker buildx bake --push \
            --set '*.attest=type=sbom' \
            --set '*.attest=type=provenance,mode=max'

      - name: Record immutable release manifest
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          MARKET_NEWS_ENABLED: ${{ vars.MARKET_NEWS_ENABLED || 'false' }}
        run: |
          [[ "${MARKET_NEWS_ENABLED}" == true ]]
          .github/scripts/test-event-contracts.sh
          mkdir -p release-evidence/sbom release-evidence/vulnerability
          infra/release/create-release-manifest.sh \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${REGISTRY}" release-evidence/release-manifest.json
          .github/scripts/augment-release-manifest.sh \
            release-evidence/release-manifest.json "${GITHUB_WORKSPACE}" linux/amd64 "${GITHUB_RUN_ID}" \
            "${MARKET_NEWS_ENABLED}"

      - name: Install checksum-pinned SBOM and scanner tools
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/home-search-tools"
          syft_version='1.44.0'
          curl --fail --location --silent --show-error --retry 3 \
            --output syft.tar.gz "https://github.com/anchore/syft/releases/download/v${syft_version}/syft_${syft_version}_linux_amd64.tar.gz"
          echo '0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a  syft.tar.gz' | sha256sum --check
          tar -xzf syft.tar.gz -C "${RUNNER_TEMP}/home-search-tools" syft
          curl --fail --location --silent --show-error --retry 3 \
            --output grype.tar.gz https://github.com/anchore/grype/releases/download/v0.115.0/grype_0.115.0_linux_amd64.tar.gz
          echo '3fad92940650e514c0aa2dad83526942a055e210cec09a8a59d9c024adc2b90e  grype.tar.gz' | sha256sum --check
          tar -xzf grype.tar.gz -C "${RUNNER_TEMP}/home-search-tools" grype
          echo "${RUNNER_TEMP}/home-search-tools" >>"${GITHUB_PATH}"

      - name: Generate SBOMs and vulnerability evidence
        run: |
          set -Eeuo pipefail
          scan_failed=0
          while IFS=$'\t' read -r name uri; do
            syft "${uri}" --output "spdx-json=release-evidence/sbom/${name}.spdx.json"
            if ! grype "${uri}" --output json --fail-on critical \
              >"release-evidence/vulnerability/${name}.json"; then
              scan_failed=1
            fi
          done < <(jq -r '(.images + .platform_images) | to_entries[] | [.key,.value.uri] | @tsv' release-evidence/release-manifest.json)
          if ! infra/release/verify-vulnerability-policy.sh \
            release-evidence/vulnerability \
            infra/release/vulnerability-exceptions.json; then
            scan_failed=1
          fi
          if [[ "${scan_failed}" -eq 0 ]]; then
            .github/scripts/finalize-release-evidence.sh \
              release-evidence/release-manifest.json \
              release-evidence/sbom \
              release-evidence/vulnerability
          fi
          exit "${scan_failed}"

      - name: Upload release manifest, SBOM, and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
