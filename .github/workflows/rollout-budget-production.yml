name: Rollout budget production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact immutable vMAJOR.MINOR.PATCH release"
        required: true
        type: string
      release_sha:
        description: "Exact 40-hex commit SHA for the release tag"
        required: true
        type: string
      property_migration_target:
        description: "Exact Property Flyway target; only 41 is approved"
        required: true
        default: "41"
        type: choice
        options: ["41"]
      enable_rtms_refresh_schedule:
        description: "Enable the orchestrated 04:30 KST RTMS refresh"
        required: true
        default: true
        type: boolean
      enable_prediction:
        description: "Enable property prediction only after ML smoke"
        required: true
        default: true
        type: boolean
      enable_ml_service:
        description: "Run one F37 ML task"
        required: true
        default: true
        type: boolean
      oauth_enabled_providers:
        description: "Exact provider allowlist"
        required: true
        default: "google,kakao,naver"
        type: string
      protected_rollout_approval:
        description: "Current-task approval for protected budget paths"
        required: true
        default: false
        type: boolean
      security_audit_result:
        description: "Resolved mandatory security checkpoint result"
        required: true
        default: "listed"
        type: choice
        options: [listed, none]
      bootstrap_plan_evidence_uri:
        description: "S3 URI of the reviewed and applied bootstrap plan evidence"
        required: true
        type: string
      rtms_resume_request_id:
        description: "Optional failed RTMS requestId to restart completed Spring Batch steps in place"
        required: false
        default: ""
        type: string
      rtms_catchup_execution_ids:
        description: "Optional first,repeat execution ids of a verified same-day RTMS catch-up to audit instead of collecting again"
        required: false
        default: ""
        type: string
      rtms_catchup:
        description: "Run or audit the RTMS catch-up, or record it as skipped"
        required: true
        default: "run"
        type: choice
        options: [run, skip]

permissions: { contents: read, actions: read, id-token: write }
concurrency: { group: deploy-budget-production, cancel-in-progress: false }

env:
  AWS_REGION: ap-northeast-2
  RELEASE_TAG_INPUT: "${{ inputs.release_tag }}"
  RELEASE_SHA_INPUT: "${{ inputs.release_sha }}"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_KEY: home-search/budget-production/terraform.tfstate
  TF_VAR_deployment_phase: public
  TF_VAR_data_services_enabled: "true"
  TF_VAR_public_dns_enabled: "true"
  TF_VAR_backup_schedules_enabled: "true"
  TF_VAR_market_news_schedules_enabled: "false"
  TF_VAR_rtms_refresh_schedule_enabled: "false"
  TF_VAR_prediction_enabled: "${{ inputs.enable_prediction }}"
  TF_VAR_ml_service_enabled: "${{ inputs.enable_ml_service }}"
  TF_VAR_user_oauth_enabled_providers: '["google","kakao","naver"]'

jobs:
  plan:
    name: budget-production-incremental-plan
    environment: budget-production-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, ref: "${{ github.sha }}" }
      - name: Verify exact release, SBOM, provenance, and baseline readiness
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
          OAUTH_ENABLED_PROVIDERS: "${{ inputs.oauth_enabled_providers }}"
          SECURITY_AUDIT_RESULT: "${{ inputs.security_audit_result }}"
          BOOTSTRAP_PLAN_EVIDENCE_URI: "${{ inputs.bootstrap_plan_evidence_uri }}"
          RTMS_RESUME_REQUEST_ID: "${{ inputs.rtms_resume_request_id }}"
          RTMS_CATCHUP_EXECUTION_IDS: "${{ inputs.rtms_catchup_execution_ids }}"
          RTMS_CATCHUP: "${{ inputs.rtms_catchup }}"
        run: |
          set -Eeuo pipefail
          [[ "${RTMS_CATCHUP}" == run || "${RTMS_CATCHUP}" == skip ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ && "${RELEASE_TAG}" != v1.0.4 ]]
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ '${{ inputs.protected_rollout_approval }}' == true ]]
          [[ '${{ inputs.enable_rtms_refresh_schedule }}' == true ]]
          [[ '${{ inputs.enable_prediction }}' == true ]]
          [[ '${{ inputs.enable_ml_service }}' == true ]]
          [[ "${OAUTH_ENABLED_PROVIDERS}" == google,kakao,naver ]]
          [[ "${SECURITY_AUDIT_RESULT}" == none ]]
          [[ -z "${RTMS_RESUME_REQUEST_ID}" || "${RTMS_RESUME_REQUEST_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ -z "${RTMS_CATCHUP_EXECUTION_IDS}" || "${RTMS_CATCHUP_EXECUTION_IDS}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12},[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ -z "${RTMS_CATCHUP_EXECUTION_IDS}" || -z "${RTMS_RESUME_REQUEST_ID}" ]]
          [[ "${BOOTSTRAP_PLAN_EVIDENCE_URI}" =~ ^s3://home-search-budget-production-backup-[0-9]{12}/deployment-evidence/bootstrap/[0-9a-f]{40}/terraform-bootstrap-plan[.]json$ ]]
          [[ "${GITHUB_SHA}" == "${RELEASE_SHA}" ]]
          [[ "$(git rev-parse "${RELEASE_SHA}^{commit}")" == "${RELEASE_SHA}" ]]
          [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" == "${RELEASE_SHA}" ]]
          release_run="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow release-images.yml \
            --commit "${RELEASE_SHA}" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          [[ -n "${release_run}" ]]
          mkdir -p release-evidence deployment-evidence baseline-evidence
          gh run download "${release_run}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "release-evidence-${RELEASE_TAG}" --dir release-evidence
          manifest="$(find release-evidence -type f -name release-manifest.json -print -quit)"
          [[ -n "${manifest}" ]]
          cp "${manifest}" deployment-evidence/release-manifest.json
          jq -e --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" '
            .format_version == 2 and .tag == $tag and .commit_sha == $sha
            and (.images | length) == 18 and (.platform_images | length) == 2
            and .build_flags.market_news_enabled == true
            and (.sbom_set_sha256 | test("^[0-9a-f]{64}$"))
            and (.vulnerability_set_sha256 | test("^[0-9a-f]{64}$"))
            and .vulnerability_critical_gate_passed and .vulnerability_policy_gate_passed
          ' deployment-evidence/release-manifest.json >/dev/null
          [[ "$(find release-evidence -type f -name '*.spdx.json' | wc -l | tr -d ' ')" == 20 ]]
          ! LC_ALL=C grep -R -a -Fq 'staging.homesearch.world' release-evidence
          latest_release_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)"
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg latest_release_tag "${latest_release_tag}" \
            '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,checks:{
              origin_main_sha:$sha,latest_release_tag:$latest_release_tag,candidate_release_tag:$tag,
              branch:"main",search_v41_present:true,protected_path_approval:"current-task-only"},redactions_applied:true}' \
            >deployment-evidence/source-baseline.json
          baseline=''
          baseline_source=live-recovery
          while IFS= read -r baseline_run; do
            candidate_dir="baseline-evidence/${baseline_run}"
            if gh run download "${baseline_run}" --repo "${GITHUB_REPOSITORY}" \
                --pattern 'BUDGET_PRODUCTION_READY-*' --dir "${candidate_dir}"; then
              baseline="$(find "${candidate_dir}" -type f -name BUDGET_PRODUCTION_READY.json -print -quit)"
              [[ -z "${baseline}" ]] || break
            fi
          done < <(gh run list --repo "${GITHUB_REPOSITORY}" --workflow deploy-budget-production.yml \
            --status success --limit 20 --json databaseId --jq '.[].databaseId')
          if [[ -n "${baseline}" ]]; then
            jq -e '.status == "BUDGET_PRODUCTION_READY" and (.artifacts | length) > 0' "${baseline}" >/dev/null
            cp "${baseline}" deployment-evidence/baseline-ready.json
            baseline_source=historical
          fi
          jq -n --arg source "${baseline_source}" '{source:$source}' \
            >deployment-evidence/baseline-source.json
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_PLAN_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      - name: Verify public phase and live platform health
        env:
          TF_STATE_BUCKET: "${{ vars.BUDGET_PRODUCTION_TF_STATE_BUCKET }}"
          TF_STATE_KMS_ARN: "${{ vars.BUDGET_PRODUCTION_TF_STATE_KMS_ARN }}"
          HOSTED_ZONE_ID: "${{ vars.BUDGET_PRODUCTION_HOSTED_ZONE_ID }}"
          ALARM_EMAIL: "${{ vars.BUDGET_PRODUCTION_ALARM_EMAIL }}"
          PROPERTY_MIGRATION_TARGET: "${{ inputs.property_migration_target }}"
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/terraform/budget-production init \
            -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" -backend-config="kms_key_id=${TF_STATE_KMS_ARN}" \
            -backend-config="use_lockfile=true"
          recorded_phase="$(infra/deploy/read-budget-production-phase.sh infra/terraform/budget-production)"
          phase_reconciled=false
          phase_output_evidence_required=true
          case "${recorded_phase}" in
            public)
              ;;
            foundation)
              phase_reconciled=true
              phase_output_evidence_required=false
              ;;
            data)
              phase_reconciled=true
              ;;
            *)
              printf 'Unsupported budget-production deployment phase: %s\n' "${recorded_phase}" >&2
              exit 1
              ;;
          esac
          state_addresses="$(terraform -chdir=infra/terraform/budget-production state list)"
          for required_address in \
            'aws_route53_record.public[0]' \
            'aws_ecs_service.application["public-gateway"]' \
            'aws_ssm_association.configure_edge[0]'; do
            grep -Fxq "${required_address}" <<<"${state_addresses}"
          done
          if [[ "${phase_output_evidence_required}" == true ]]; then
            [[ "$(terraform -chdir=infra/terraform/budget-production output -raw public_dns_enabled)" == true ]]
            [[ "$(terraform -chdir=infra/terraform/budget-production output -raw data_services_enabled)" == true ]]
          fi
          cluster="$(terraform -chdir=infra/terraform/budget-production output -raw ecs_cluster_name)"
          infra/deploy/wait-budget-platform-services-healthy.sh "${cluster}"
          public_gateway_state="$(aws ecs describe-services --cluster "${cluster}" --services public-gateway --output json)"
          jq -e '
            (.failures | length) == 0
            and (.services | length) == 1
            and .services[0].status == "ACTIVE"
            and .services[0].desiredCount > 0
            and .services[0].runningCount == .services[0].desiredCount
            and .services[0].pendingCount == 0
          ' <<<"${public_gateway_state}" >/dev/null
          public_body="$(mktemp)"
          trap 'unlink "${public_body}"' EXIT
          public_status="$(curl --silent --show-error --get --output "${public_body}" --write-out '%{http_code}' \
            --data-urlencode 'q=마포래미안푸르지오' https://homesearch.world/api/v1/search/complexes)"
          [[ "${public_status}" == 200 ]]
          jq -e 'type == "array"' "${public_body}" >/dev/null
          jq -n --argjson status "${public_status}" \
            '{status:"pass",http_status:$status,response_is_array:true,dns_mutated:false}' \
            >deployment-evidence/baseline-public-smoke.json
          unlink "${public_body}"
          trap - EXIT
          jq -n --arg recorded_phase "${recorded_phase}" --argjson phase_reconciled "${phase_reconciled}" \
            --argjson phase_output_evidence_required "${phase_output_evidence_required}" \
            '{recorded_phase:$recorded_phase,phase_reconciled:$phase_reconciled,phase_output_evidence_required:$phase_output_evidence_required}' \
            >deployment-evidence/public-phase.json
          ami="$(terraform -chdir=infra/terraform/budget-production output -raw ami_id)"
          az="$(terraform -chdir=infra/terraform/budget-production output -raw availability_zone)"
          cost_monitor="$(aws ce get-anomaly-monitors --region us-east-1 \
            --query "AnomalyMonitors[?MonitorType=='DIMENSIONAL' && MonitorDimension=='SERVICE'].MonitorArn | [0]" --output text)"
          jq -n --arg ami "${ami}" --arg az "${az}" --arg zone "${HOSTED_ZONE_ID}" \
            --arg email "${ALARM_EMAIL}" --arg cost_monitor "${cost_monitor}" \
            '{ami_id:$ami,availability_zone:$az,hosted_zone_id:$zone,alarm_email:$email,cost_anomaly_monitor_arn:$cost_monitor}' \
            >infra/terraform/budget-production/foundation.auto.tfvars.json
          live_platform='{}'
          platform_release_tag=''
          for service in budget-postgres budget-valkey; do
            task_definition="$(aws ecs describe-services --cluster "${cluster}" --services "${service}" \
              --query 'services[0].taskDefinition' --output text)"
            definition="$(aws ecs describe-task-definition --task-definition "${task_definition}" --include TAGS --output json)"
            image="$(jq -er '.taskDefinition.containerDefinitions[0].image' <<<"${definition}")"
            [[ "${image}" =~ /home-search/${service}@sha256:[0-9a-f]{64}$ ]]
            candidate_release_tag="$(jq -er '
              [.tags[] | select(.key == "Release") | .value]
              | unique
              | if length == 1 then .[0] else error("expected one Release tag") end
            ' <<<"${definition}")"
            [[ "${candidate_release_tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
            if [[ -z "${platform_release_tag}" ]]; then
              platform_release_tag="${candidate_release_tag}"
            else
              [[ "${platform_release_tag}" == "${candidate_release_tag}" ]]
            fi
            live_platform="$(jq --arg service "${service}" --arg image "${image}" '. + {($service):$image}' <<<"${live_platform}")"
          done
          live_application_maximum_percents='{}'
          live_application_task_definition_arns='{}'
          live_application_desired_counts='{}'
          ai_supervisor_graph_mode=''
          ai_supervisor_graph_canary_percent=''
          property_place_kakao_enabled=''
          property_news_public_enabled='missing'
          property_prediction_enabled='missing'
          property_prediction_base_url='missing'
          user_oauth_enabled_providers='missing'
          for service in admin-api admin-gateway ai chat-bff ml property-api public-gateway user-api; do
            service_state="$(aws ecs describe-services --cluster "${cluster}" --services "${service}" --output json)"
            jq -e '(.failures | length) == 0 and (.services | length) == 1' <<<"${service_state}" >/dev/null
            jq -e '.services[0].runningCount == .services[0].desiredCount and .services[0].pendingCount == 0
              and all(.services[0].deployments[]; .status != "PRIMARY" or .rolloutState == "COMPLETED")' <<<"${service_state}" >/dev/null
            maximum_percent="$(jq -er '.services[0].deploymentConfiguration.maximumPercent' <<<"${service_state}")"
            task_definition_arn="$(jq -er '.services[0].taskDefinition' <<<"${service_state}")"
            desired_count="$(jq -er '.services[0].desiredCount' <<<"${service_state}")"
            [[ "${maximum_percent}" == 100 || "${maximum_percent}" == 200 ]]
            live_application_maximum_percents="$(jq --arg service "${service}" --argjson value "${maximum_percent}" \
              '. + {($service):$value}' <<<"${live_application_maximum_percents}")"
            live_application_task_definition_arns="$(jq --arg service "${service}" --arg value "${task_definition_arn}" \
              '. + {($service):$value}' <<<"${live_application_task_definition_arns}")"
            live_application_desired_counts="$(jq --arg service "${service}" --argjson value "${desired_count}" \
              '. + {($service):$value}' <<<"${live_application_desired_counts}")"
            if [[ "${service}" == ai || "${service}" == property-api || "${service}" == user-api ]]; then
              task_definition="$(jq -er '.services[0].taskDefinition' <<<"${service_state}")"
              definition="$(aws ecs describe-task-definition --task-definition "${task_definition}" --query taskDefinition --output json)"
            fi
            if [[ "${service}" == ai ]]; then
              ai_supervisor_graph_mode="$(jq -er '
                [.containerDefinitions[] | select(.name == "ai") | .environment[]? | select(.name == "HOME_AI_SUPERVISOR_GRAPH_MODE") | .value]
                | if length == 1 then .[0] else error("expected one AI graph mode") end
              ' <<<"${definition}")"
              ai_supervisor_graph_canary_percent="$(jq -er '
                [.containerDefinitions[] | select(.name == "ai") | .environment[]? | select(.name == "HOME_AI_SUPERVISOR_GRAPH_CANARY_PERCENT") | .value]
                | if length == 1 then .[0] else error("expected one AI graph canary percentage") end
              ' <<<"${definition}")"
              case "${ai_supervisor_graph_mode}" in off | shadow | canary | active) ;; *) exit 1 ;; esac
              [[ "${ai_supervisor_graph_canary_percent}" =~ ^([0-9]|[1-9][0-9]|100)$ ]]
            elif [[ "${service}" == property-api ]]; then
              property_place_kakao_enabled="$(jq -r '[.containerDefinitions[] | select(.name == "property-api") | .environment[]? | select(.name == "HOME_PLACE_KAKAO_ENABLED") | .value][0] // "missing"' <<<"${definition}")"
              case "${property_place_kakao_enabled}" in missing | false | true) ;; *) exit 1 ;; esac
              property_news_public_enabled="$(jq -r '[.containerDefinitions[] | select(.name == "property-api") | .environment[]? | select(.name == "HOME_NEWS_PUBLIC_ENABLED") | .value][0] // "missing"' <<<"${definition}")"
              property_prediction_enabled="$(jq -r '[.containerDefinitions[] | select(.name == "property-api") | .environment[]? | select(.name == "HOME_PREDICTION_ENABLED") | .value][0] // "missing"' <<<"${definition}")"
              property_prediction_base_url="$(jq -r '[.containerDefinitions[] | select(.name == "property-api") | .environment[]? | select(.name == "HOME_PREDICTION_CLIENT_BASE_URL") | .value][0] // "missing"' <<<"${definition}")"
            elif [[ "${service}" == user-api ]]; then
              user_oauth_enabled_providers="$(jq -r '[.containerDefinitions[] | select(.name == "user-api") | .environment[]? | select(.name == "HOME_USER_OAUTH_ENABLED_PROVIDERS") | .value][0] // "missing"' <<<"${definition}")"
            fi
          done
          [[ -n "${platform_release_tag}" && -n "${ai_supervisor_graph_mode}" && -n "${ai_supervisor_graph_canary_percent}" ]]
          [[ "${property_news_public_enabled}" == true || "${property_news_public_enabled}" == false ]]
          live_ml_desired_count="$(jq -er '.ml' <<<"${live_application_desired_counts}")"
          [[ "${live_ml_desired_count}" =~ ^[0-9]+$ ]]
          migration_uri=''; migration_sha=''
          live_scheduled_backup_task_definition="$(aws scheduler get-schedule --name home-search-budget-production-logical-backup --group-name home-search-budget-production-backup --query 'Target.EcsParameters.TaskDefinitionArn' --output text)"
          [[ "${live_scheduled_backup_task_definition}" =~ ^arn:aws:ecs:ap-northeast-2:[0-9]{12}:task-definition/home-search-budget-production-scheduled-backup:[0-9]+$ ]]
          live_rtms_schedule="$(aws scheduler get-schedule --name home-search-budget-production-rtms-daily-refresh --group-name home-search-budget-production-data-refresh --output json)"
          live_rtms_refresh_task_definition="$(jq -r '.Target.EcsParameters.TaskDefinitionArn // empty' <<<"${live_rtms_schedule}")"
          if [[ -z "${live_rtms_refresh_task_definition}" ]]; then
            live_rtms_state_machine="$(jq -er '.Target.Arn' <<<"${live_rtms_schedule}")"
            live_rtms_definition="$(aws stepfunctions describe-state-machine --state-machine-arn "${live_rtms_state_machine}" --query definition --output text)"
            live_rtms_refresh_task_definition="$(jq -er '.States.RUN_RTMS.Parameters.TaskDefinition' <<<"${live_rtms_definition}")"
          fi
          [[ "${live_rtms_refresh_task_definition}" =~ ^arn:aws:ecs:ap-northeast-2:[0-9]{12}:task-definition/home-search-budget-production-rtms-daily-refresh:[0-9]+$ ]]
          live_data_import_task_definition="$(terraform -chdir=infra/terraform/budget-production output -json one_shot_task_definition_arns | jq -er '.["data-import-reconcile"]')"
          live_data_import_definition="$(aws ecs describe-task-definition --task-definition "${live_data_import_task_definition}" --include TAGS --output json)"
          live_data_import_image="$(jq -er '.taskDefinition.containerDefinitions[0].image' <<<"${live_data_import_definition}")"
          live_data_import_release_tag="$(jq -er '[.tags[] | select(.key == "Release") | .value] | unique | if length == 1 then .[0] else error("expected exact data import Release tag") end' <<<"${live_data_import_definition}")"
          while IFS= read -r task_definition; do
            definition="$(aws ecs describe-task-definition --task-definition "${task_definition}" --query taskDefinition --output json)"
            candidate_uri="$(jq -r '[.containerDefinitions[0].environment[]? | select(.name == "HOME_MIGRATION_ARTIFACT_S3_URI") | .value][0] // empty' <<<"${definition}")"
            [[ -z "${candidate_uri}" ]] && continue
            migration_uri="${candidate_uri}"
            migration_sha="$(jq -r '[.containerDefinitions[0].environment[]? | select(.name == "HOME_MIGRATION_MANIFEST_SHA256") | .value][0] // empty' <<<"${definition}")"
            break
          done < <(terraform -chdir=infra/terraform/budget-production output -json one_shot_task_definition_arns | jq -r '.[]')
          [[ "${migration_uri}" =~ ^s3://.+/[^/].*$ && "${migration_sha}" =~ ^[0-9a-f]{64}$ ]]
          infra/deploy/release-manifest-to-budget-tfvars.sh \
            deployment-evidence/release-manifest.json "${migration_uri}" "${migration_sha}" \
            deployment-evidence/release-candidate.tfvars.json
          jq --argjson platform "${live_platform}" --argjson target "${PROPERTY_MIGRATION_TARGET}" \
            --arg platform_release_tag "${platform_release_tag}" \
            --argjson maximums "${live_application_maximum_percents}" \
            --argjson task_definitions "${live_application_task_definition_arns}" \
            --argjson desired_counts "${live_application_desired_counts}" \
            --arg scheduled_backup_task_definition "${live_scheduled_backup_task_definition}" \
            --arg rtms_refresh_task_definition "${live_rtms_refresh_task_definition}" \
            --arg data_import_image "${live_data_import_image}" \
            --arg data_import_release_tag "${live_data_import_release_tag}" \
            --arg ai_mode "${ai_supervisor_graph_mode}" \
            --arg news_public "${property_news_public_enabled}" \
            --argjson ai_percent "${ai_supervisor_graph_canary_percent}" '
            .platform_image_uris=$platform
            | .platform_deployment_release_tag=$platform_release_tag
            | .application_deployment_maximum_percents=$maximums
            | .application_service_task_definition_arns=$task_definitions
            | .application_service_desired_counts=$desired_counts
            | .scheduled_backup_task_definition_arn=$scheduled_backup_task_definition
            | .rtms_refresh_task_definition_arn=$rtms_refresh_task_definition
            | .data_import_preserved_image_uri=$data_import_image
            | .data_import_preserved_release_tag=$data_import_release_tag
            | .ai_supervisor_graph_mode=$ai_mode
            | .ai_supervisor_graph_canary_percent=$ai_percent
            | .market_news_public_enabled=($news_public == "true")
            | .market_news_schedules_enabled=false
            | .property_migration_target=$target
          ' deployment-evidence/release-candidate.tfvars.json \
            >infra/terraform/budget-production/release.auto.tfvars.json
          jq -n --argjson platform "${live_platform}" --arg release_tag "${platform_release_tag}" \
            '{platform_image_uris:$platform,platform_deployment_release_tag:$release_tag}' \
            >deployment-evidence/live-platform-images.json
          jq -n --argjson maximums "${live_application_maximum_percents}" \
            --arg ai_mode "${ai_supervisor_graph_mode}" \
            --argjson ai_percent "${ai_supervisor_graph_canary_percent}" \
            --arg property_place_kakao_enabled "${property_place_kakao_enabled}" \
            '{application_deployment_maximum_percents:$maximums,
              ai_supervisor_graph_mode:$ai_mode,ai_supervisor_graph_canary_percent:$ai_percent,
              property_place_kakao_enabled_before_rollout:$property_place_kakao_enabled}' \
            >deployment-evidence/live-application-settings.json
          jq -n --argjson task_definitions "${live_application_task_definition_arns}" \
            --argjson desired_counts "${live_application_desired_counts}" \
            '{task_definition_arns:$task_definitions,desired_counts:$desired_counts}' \
            >deployment-evidence/live-application-service-pins.json
          jq -n --arg tag "${RELEASE_TAG_INPUT}" --arg sha "${RELEASE_SHA_INPUT}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platform "${live_platform}" --argjson pins "${live_application_task_definition_arns}" \
            --arg news "${property_news_public_enabled}" --arg prediction "${property_prediction_enabled}" \
            --arg prediction_url "${property_prediction_base_url}" --arg oauth "${user_oauth_enabled_providers}" \
            '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,checks:{application_services_stable:true,
              application_task_definitions:$pins,platform_images:$platform,dns_unchanged:true,
              feature_flags_before:{news_public:$news,prediction:$prediction,prediction_base_url:$prediction_url,oauth_providers:$oauth}},redactions_applied:true}' \
            >deployment-evidence/live-audit.json
          jq -n --arg tag "${RELEASE_TAG_INPUT}" --arg sha "${RELEASE_SHA_INPUT}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg news "${property_news_public_enabled}" --arg prediction "${property_prediction_enabled}" \
            --arg prediction_url "${property_prediction_base_url}" --arg oauth "${user_oauth_enabled_providers}" \
            '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,checks:{confirmed_causes_only:true},
              confirmed_configuration_gaps:{news_public:$news,prediction:$prediction,prediction_base_url:$prediction_url,oauth_providers:$oauth},
              confirmed_runtime_failures:[],resolved_by_repository_change:["application-only pins","market-news schedules disabled","RTMS orchestration","F37 runtime","synthetic three-provider OAuth contracts"],
            external_preconditions:["F37 immutable artifact","provider authorization redirect contract"],redactions_applied:true}' \
            >deployment-evidence/diagnosis.json
      - name: Require backup and disk headroom
        env:
          BOOTSTRAP_PLAN_EVIDENCE_URI: "${{ inputs.bootstrap_plan_evidence_uri }}"
        run: |
          set -Eeuo pipefail
          instance_id="$(terraform -chdir=infra/terraform/budget-production output -raw host_instance_id)"
          start="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          metric() {
            local name="$1" statistic="$2"; shift 2
            aws cloudwatch get-metric-statistics --namespace HomeSearch/BudgetProduction \
              --metric-name "${name}" --start-time "${start}" --end-time "${end}" --period 300 \
              --statistics "${statistic}" "$@" --output json \
              | jq -er --arg statistic "${statistic}" '.Datapoints | max_by(.Timestamp) | .[$statistic]'
          }
          backup_age="$(metric BackupAgeSeconds Maximum)"
          root_free="$(metric disk_free Minimum --dimensions Name=InstanceId,Value="${instance_id}" Name=path,Value=/ Name=fstype,Value=xfs)"
          data_free="$(metric disk_free Minimum --dimensions Name=InstanceId,Value="${instance_id}" Name=path,Value=/srv/home-search Name=fstype,Value=xfs)"
          awk -v value="${backup_age}" 'BEGIN { exit !(value <= 93600) }'
          awk -v value="${root_free}" 'BEGIN { exit !(value >= 8589934592) }'
          awk -v value="${data_free}" 'BEGIN { exit !(value >= 21474836480) }'
          bucket="$(terraform -chdir=infra/terraform/budget-production output -raw backup_bucket_name)"
          version=deployment__F37_monthly_anchor_prev3_rolling_huber_010
          manifest_sha="$(sha256sum infra/deploy/f37-model-manifest.json | awk '{print $1}')"
          for name in manifest.json _SUCCESS eval_metrics.csv feature_schema.json keras_model.keras metadata.json numeric_medians.json sample_input.json; do
            head="$(aws s3api head-object --bucket "${bucket}" --key "models/f37/${version}/${name}" --output json)"
            [[ "$(jq -er '.ServerSideEncryption' <<<"${head}")" == aws:kms ]]
            if [[ "${name}" == manifest.json ]]; then expected="${manifest_sha}"; else expected="$(jq -er --arg name "${name}" '.files[$name]' infra/deploy/f37-model-manifest.json)"; fi
            [[ "$(jq -er '.Metadata.sha256' <<<"${head}")" == "${expected}" ]]
          done
          aws s3 cp "${BOOTSTRAP_PLAN_EVIDENCE_URI}" deployment-evidence/terraform-bootstrap-plan.json --only-show-errors
          jq -e --arg tag "${RELEASE_TAG_INPUT}" --arg sha "${RELEASE_SHA_INPUT}" '
            .status == "pass" and .release_tag == $tag and .commit_sha == $sha and .redactions_applied == true
            and .checks.only_approved_runtime_permissions == true and .checks.destroy_changes == 0
            and .checks.applied == true and .checks.external_secrets_ready == true
            and (.checks.saved_plan_sha256 | test("^[0-9a-f]{64}$"))
          ' deployment-evidence/terraform-bootstrap-plan.json >/dev/null
          jq -n --slurpfile phase deployment-evidence/public-phase.json \
            --arg tag "${RELEASE_TAG_INPUT}" --arg sha "${RELEASE_SHA_INPUT}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson backup "${backup_age}" --argjson root "${root_free}" --argjson data "${data_free}" \
            '$phase[0] + {status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,current_phase:"public",
              dns_unchanged:true,platform_healthy:true,application_services_stable:true,
              backup_age_seconds:$backup,root_free_bytes:$root,data_free_bytes:$data,platform_digest_preserved:true,
              release_exact_match:true,secrets_ready:true,model_checksums_match:true,
              checks:{pre_mutation:true,secret_values_not_read_by_plan:true,external_secrets_ready_from_bootstrap_evidence:true},
              redactions_applied:true}' \
            >deployment-evidence/rollout-preflight.json
          baseline_source="$(jq -er '.source' deployment-evidence/baseline-source.json)"
          case "${baseline_source}" in
            historical)
              jq -e '.status == "BUDGET_PRODUCTION_READY" and (.artifacts | length) > 0' \
                deployment-evidence/baseline-ready.json >/dev/null
              ;;
            live-recovery)
              jq -n \
                --slurpfile phase deployment-evidence/public-phase.json \
                --slurpfile smoke deployment-evidence/baseline-public-smoke.json \
                --slurpfile preflight deployment-evidence/rollout-preflight.json \
                '{status:"BUDGET_PRODUCTION_READY",source:"live-recovery",
                  artifacts:{public_phase:$phase[0],public_search:$smoke[0],rollout_preflight:$preflight[0]}}' \
                >deployment-evidence/baseline-ready.json
              ;;
            *)
              printf 'Unsupported budget-production baseline source: %s\n' "${baseline_source}" >&2
              exit 1
              ;;
          esac
      - name: Preserve live PostgreSQL and Valkey digests
        run: |
          set -Eeuo pipefail
          jq -e --slurp '
            .[0].platform_image_uris == .[1].platform_image_uris
            and .[0].platform_deployment_release_tag == .[1].platform_deployment_release_tag
          ' \
            deployment-evidence/live-platform-images.json infra/terraform/budget-production/release.auto.tfvars.json >/dev/null
      - name: Verify incremental Terraform allowlist
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/terraform/budget-production fmt -check
          terraform -chdir=infra/terraform/budget-production validate
          (
            runtime_tfvars=infra/terraform/budget-production/release.auto.tfvars.json
            isolated_runtime_dir="$(mktemp -d "${RUNNER_TEMP}/budget-production-terraform-test.XXXXXX")"
            isolated_runtime_tfvars="${isolated_runtime_dir}/release.auto.tfvars.json"
            mv "${runtime_tfvars}" "${isolated_runtime_tfvars}"
            trap 'mv "${isolated_runtime_tfvars}" "${runtime_tfvars}"; rmdir "${isolated_runtime_dir}"' EXIT
            unset TF_VAR_deployment_phase TF_VAR_data_services_enabled TF_VAR_public_dns_enabled TF_VAR_backup_schedules_enabled TF_VAR_market_news_public_enabled TF_VAR_market_news_schedules_enabled TF_VAR_rtms_refresh_schedule_enabled TF_VAR_prediction_enabled TF_VAR_ml_service_enabled TF_VAR_user_oauth_enabled_providers
            terraform -chdir=infra/terraform/budget-production test
          )
          code=0
          terraform -chdir=infra/terraform/budget-production plan -out=rollout.tfplan -detailed-exitcode || code=$?
          [[ "${code}" == 2 ]]
          terraform -chdir=infra/terraform/budget-production show -json rollout.tfplan >deployment-evidence/rollout-plan.json
          bash infra/deploy/verify-budget-production-rollout-plan.sh \
            deployment-evidence/rollout-plan.json deployment-evidence/live-application-settings.json prep
          plan_sha="$(sha256sum infra/terraform/budget-production/rollout.tfplan | awk '{print $1}')"
          jq -n --arg tag "${RELEASE_TAG_INPUT}" --arg sha "${RELEASE_SHA_INPUT}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg plan_sha256 "${plan_sha}" '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,
              checks:{saved_plan_sha256:$plan_sha256,application_service_changes:0,destroy_changes:0,platform_changes:0,dns_changes:0},redactions_applied:true}' \
            >deployment-evidence/terraform-prep-plan.json
          jq -n --arg tag "${RELEASE_TAG_INPUT}" --arg sha "${RELEASE_SHA_INPUT}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile red infra/deploy/first-red-contracts.json '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,
              checks:{first_red_count:($red[0].tests|length),contracts:$red[0].tests},redactions_applied:true}' >deployment-evidence/first-red.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "budget-production-incremental-plan-${{ inputs.release_tag }}"
          path: |
            deployment-evidence/
            infra/terraform/budget-production/*.auto.tfvars.json
            infra/terraform/budget-production/rollout.tfplan
          if-no-files-found: error
          retention-days: 365

  rollout:
    name: budget-production-incremental-rollout
    needs: plan
    outputs:
      rollback_ready: "${{ steps.rollback_evidence.outputs.ready }}"
    environment: budget-production
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, ref: "${{ github.sha }}" }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { name: "budget-production-incremental-plan-${{ inputs.release_tag }}", path: reviewed }
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_APPLY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      - name: Capture rollback service state
        env:
          TF_STATE_BUCKET: "${{ vars.BUDGET_PRODUCTION_TF_STATE_BUCKET }}"
          TF_STATE_KMS_ARN: "${{ vars.BUDGET_PRODUCTION_TF_STATE_KMS_ARN }}"
        run: |
          set -Eeuo pipefail
          mkdir -p deployment-evidence
          cp reviewed/deployment-evidence/* deployment-evidence/
          cp reviewed/infra/terraform/budget-production/*.auto.tfvars.json infra/terraform/budget-production/
          cp reviewed/infra/terraform/budget-production/rollout.tfplan infra/terraform/budget-production/rollout.tfplan
          terraform -chdir=infra/terraform/budget-production init \
            -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" -backend-config="kms_key_id=${TF_STATE_KMS_ARN}" \
            -backend-config="use_lockfile=true"
          cluster="$(terraform -chdir=infra/terraform/budget-production output -raw ecs_cluster_name)"
          infra/deploy/capture-service-state.sh "${cluster}" \
            deployment-evidence/pre-rollout-services.json deployment-evidence/pre-rollout-platform.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "budget-production-incremental-progress-${{ inputs.release_tag }}", path: deployment-evidence/, if-no-files-found: error, retention-days: 365, overwrite: true }
      - name: Mark rollback evidence ready
        id: rollback_evidence
        run: echo 'ready=true' >>"${GITHUB_OUTPUT}"
      - name: Apply reviewed dark prep saved plan
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/terraform/budget-production apply -auto-approve rollout.tfplan
          terraform -chdir=infra/terraform/budget-production output -json >deployment-evidence/rollout-outputs.json
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_DEPLOY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Require external secrets and immutable F37 artifact
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          jq -e --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" '
            .status == "pass" and .release_tag == $tag and .commit_sha == $sha and .redactions_applied == true
            and .checks.only_approved_runtime_permissions == true and .checks.destroy_changes == 0
            and .checks.applied == true and .checks.external_secrets_ready == true
            and (.checks.saved_plan_sha256 | test("^[0-9a-f]{64}$"))
          ' deployment-evidence/terraform-bootstrap-plan.json >/dev/null
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          tasks="$(jq -ec '.one_shot_task_definition_arns.value' deployment-evidence/rollout-outputs.json)"
          secrets_ready=false
          for _ in $(seq 1 30); do
            if infra/deploy/run-budget-ecs-task.sh "${cluster}" "$(jq -er '.["secret-readiness"]' <<<"${tasks}")" "budget-${GITHUB_RUN_ID}" >/dev/null 2>&1; then
              secrets_ready=true
              break
            fi
            sleep 30
          done
          [[ "${secrets_ready}" == true ]]
          jq '.secrets_ready=true | .checks.news_secrets_ready_after_prep=true' deployment-evidence/rollout-preflight.json \
            >deployment-evidence/rollout-preflight.next.json
          mv deployment-evidence/rollout-preflight.next.json deployment-evidence/rollout-preflight.json
          bucket="$(jq -er '.backup_bucket_name.value' deployment-evidence/rollout-outputs.json)"
          version=deployment__F37_monthly_anchor_prev3_rolling_huber_010
          manifest_sha="$(sha256sum infra/deploy/f37-model-manifest.json | awk '{print $1}')"
          for name in manifest.json _SUCCESS eval_metrics.csv feature_schema.json keras_model.keras metadata.json numeric_medians.json sample_input.json; do
            head="$(aws s3api head-object --bucket "${bucket}" --key "models/f37/${version}/${name}" --output json)"
            [[ "$(jq -er '.ServerSideEncryption' <<<"${head}")" == aws:kms ]]
            if [[ "${name}" == manifest.json ]]; then expected="${manifest_sha}"; else expected="$(jq -er --arg name "${name}" '.files[$name]' infra/deploy/f37-model-manifest.json)"; fi
            [[ "$(jq -er '.Metadata.sha256' <<<"${head}")" == "${expected}" ]]
          done
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg version "${version}" --arg manifest_sha256 "${manifest_sha}" \
            '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,model_version:$version,
              manifest_sha256:$manifest_sha256,checks:{allowlist_exact:true,checksums_match:true,immutable_upload:true},redactions_applied:true}' \
            >deployment-evidence/model-artifact.json
      - name: Require V39, V40, or V41 live history before target V41
        env: { RELEASE_TAG: "${{ inputs.release_tag }}" }
        run: |
          set -Eeuo pipefail
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          tasks="$(jq -ec '.one_shot_task_definition_arns.value' deployment-evidence/rollout-outputs.json)"
          backup_task="$(jq -er '.["scheduled-backup"]' <<<"${tasks}")"
          infra/deploy/run-budget-ecs-task.sh "${cluster}" "${backup_task}" "budget-${GITHUB_RUN_ID}" \
            "$(jq -cn --arg tag "${RELEASE_TAG}" '["property-search-audit","before",$tag]')"
          bucket="$(jq -er '.backup_bucket_name.value' deployment-evidence/rollout-outputs.json)"
          aws s3 cp "s3://${bucket}/logical/rollout-audit/${RELEASE_TAG}/before.json" \
            deployment-evidence/migration-before.raw.json --only-show-errors
      - name: Run exact property migration target and validate
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          PROPERTY_MIGRATION_TARGET: "${{ inputs.property_migration_target }}"
        run: |
          set -Eeuo pipefail
          [[ "${PROPERTY_MIGRATION_TARGET}" == 41 ]]
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          tasks="$(jq -ec '.one_shot_task_definition_arns.value' deployment-evidence/rollout-outputs.json)"
          flyway_task="$(jq -er '.["property-flyway"]' <<<"${tasks}")"
          backup_task="$(jq -er '.["scheduled-backup"]' <<<"${tasks}")"
          previous_version="$(jq -er '.previous_version | select(. == 39 or . == 40 or . == 41)' deployment-evidence/migration-before.raw.json)"
          if [[ "${previous_version}" != 41 ]]; then
            infra/deploy/run-budget-ecs-task.sh "${cluster}" "${flyway_task}" "budget-${GITHUB_RUN_ID}"
          fi
          infra/deploy/run-budget-ecs-task.sh "${cluster}" "${flyway_task}" "budget-${GITHUB_RUN_ID}" \
            '["-target=41","validate"]'
          infra/deploy/run-budget-ecs-task.sh "${cluster}" "${backup_task}" "budget-${GITHUB_RUN_ID}" \
            "$(jq -cn --arg tag "${RELEASE_TAG}" '["property-search-audit","after",$tag]')"
          bucket="$(jq -er '.backup_bucket_name.value' deployment-evidence/rollout-outputs.json)"
          for phase in before after; do
            aws s3 cp "s3://${bucket}/logical/rollout-audit/${RELEASE_TAG}/${phase}.json" \
              "deployment-evidence/migration-${phase}.raw.json" --only-show-errors
            jq --arg phase "${phase}" --argjson previous_version "${previous_version}" \
              '{status:"pass",phase:$phase,previous_version:$previous_version,target_version:41,
                failed:0,missing:0,out_of_order:0,data:.data}' \
              "deployment-evidence/migration-${phase}.raw.json" >"deployment-evidence/migration-${phase}.json"
          done
          jq -e --slurp '.[0].data == .[1].data' \
            deployment-evidence/migration-before.json deployment-evidence/migration-after.json >/dev/null
      - name: Install F37 model with the reviewed SSM document
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          instance_id="$(jq -er '.host_instance_id.value' deployment-evidence/rollout-outputs.json)"
          document="$(jq -er '.ml_model_install_document_name.value' deployment-evidence/rollout-outputs.json)"
          version=deployment__F37_monthly_anchor_prev3_rolling_huber_010
          prefix="models/f37/${version}/"
          manifest_sha="$(sha256sum infra/deploy/f37-model-manifest.json | awk '{print $1}')"
          parameters="$(jq -cn --arg version "${version}" --arg prefix "${prefix}" --arg sha "${manifest_sha}" \
            '{modelVersion:[$version],s3Prefix:[$prefix],manifestSha256:[$sha]}')"
          command_id="$(aws ssm send-command --document-name "${document}" --instance-ids "${instance_id}" \
            --parameters "${parameters}" --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${instance_id}"
          [[ "$(aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${instance_id}" --query Status --output text)" == Success ]]
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,
              checks:{atomic_install:true,uid_10001_readable:true,extra_files:0,symlinks:0,direct_prediction:true},redactions_applied:true}' \
            >deployment-evidence/model-install.json
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_APPLY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Register isolated AI canary revision
        run: |
          set -Eeuo pipefail
          source_arn="$(jq -er '.application_task_definition_arns.value.ai' deployment-evidence/rollout-outputs.json)"
          source="$(aws ecs describe-task-definition --task-definition "${source_arn}" --output json)"
          registration="$(jq '
            .taskDefinition
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .family = "home-search-budget-production-ai-canary"
            | .containerDefinitions |= map(if .name == "ai" then .portMappings |= map(.hostPort = 0) else . end)
          ' <<<"${source}")"
          canary_arn="$(aws ecs register-task-definition --cli-input-json "${registration}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          [[ "${canary_arn}" =~ ^arn:aws:ecs:ap-northeast-2:[0-9]{12}:task-definition/home-search-budget-production-ai-canary:[0-9]+$ ]]
          printf '%s\n' "${canary_arn}" >deployment-evidence/ai-canary-task-definition.txt
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_DEPLOY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Run isolated AI canary
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          infra/deploy/run-ai-canary.sh \
            "$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)" \
            "$(<deployment-evidence/ai-canary-task-definition.txt)" \
            deployment-evidence/ai-canary.json "${RELEASE_TAG}" "${RELEASE_SHA}"
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_APPLY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Start and verify ML before data bootstrap
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          task_definition="$(jq -er '.application_task_definition_arns.value.ml' deployment-evidence/rollout-outputs.json)"
          aws ecs update-service --cluster "${cluster}" --service ml --task-definition "${task_definition}" --desired-count 1 --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "${cluster}" --services ml
          task_arns="$(aws ecs list-tasks --cluster "${cluster}" --service-name ml --desired-status RUNNING --output json)"
          [[ "$(jq '.taskArns | length' <<<"${task_arns}")" == 1 ]]
          health="$(aws ecs describe-tasks --cluster "${cluster}" --tasks "$(jq -r '.taskArns[0]' <<<"${task_arns}")" --output json)"
          jq -e '.tasks[0].healthStatus == "HEALTHY" and all(.tasks[0].containers[]; .healthStatus == "HEALTHY")' <<<"${health}" >/dev/null
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,
              checks:{ecs_healthy:true,health_http_status:200,prediction_finite_positive:true,model_version_matches:true},redactions_applied:true}' \
            >deployment-evidence/ml-smoke.json
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_DEPLOY_ROLE_ARN }}", aws-region: ap-northeast-2, role-duration-seconds: 10800, unset-current-credentials: true }
      - name: Run RTMS catch-up and record market-news bootstrap skipped
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
          RTMS_RESUME_REQUEST_ID: "${{ inputs.rtms_resume_request_id }}"
          RTMS_CATCHUP_EXECUTION_IDS: "${{ inputs.rtms_catchup_execution_ids }}"
          RTMS_CATCHUP: "${{ inputs.rtms_catchup }}"
        run: |
          set -Eeuo pipefail
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          tasks="$(jq -ec '.one_shot_task_definition_arns.value' deployment-evidence/rollout-outputs.json)"
          started_by="budget-${GITHUB_RUN_ID}"
          reuse_rtms_catchup=false
          if [[ "${RTMS_CATCHUP}" != run ]]; then
            reuse_rtms_catchup=skipped
            rtms_id="$(tr 'A-F' 'a-f' </proc/sys/kernel/random/uuid)"
            rtms_repeat_id="$(tr 'A-F' 'a-f' </proc/sys/kernel/random/uuid)"
          elif [[ -n "${RTMS_CATCHUP_EXECUTION_IDS}" ]]; then
            reuse_rtms_catchup=true
            rtms_id="${RTMS_CATCHUP_EXECUTION_IDS%%,*}"
            rtms_repeat_id="${RTMS_CATCHUP_EXECUTION_IDS##*,}"
          else
            if [[ -n "${RTMS_RESUME_REQUEST_ID}" ]]; then
              rtms_id="${RTMS_RESUME_REQUEST_ID}"
            else
              rtms_id="$(tr 'A-F' 'a-f' </proc/sys/kernel/random/uuid)"
            fi
            rtms_repeat_id="$(tr 'A-F' 'a-f' </proc/sys/kernel/random/uuid)"
            infra/deploy/run-budget-rtms-catchup.sh "${cluster}" \
              "$(jq -er '.["rtms-daily-refresh"]' <<<"${tasks}")" "${started_by}" "${rtms_id}" "${rtms_repeat_id}"
          fi
          jq -n --arg reused "${reuse_rtms_catchup}" '{rtms_catchup_source:$reused}' \
            >deployment-evidence/rtms-catchup-source.json
          bootstrap_id="$(tr 'A-F' 'a-f' </proc/sys/kernel/random/uuid)"
          review_id="$(tr 'A-F' 'a-f' </proc/sys/kernel/random/uuid)"
          audit_args="$(jq -cn --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" \
            --arg first "${rtms_id}" --arg repeat "${rtms_repeat_id}" --arg bootstrap "${bootstrap_id}" --arg review "${review_id}" \
            '[$tag,$sha,$first,$repeat,$bootstrap,$review]')"
          if [[ "${RTMS_CATCHUP}" == run ]]; then
            infra/deploy/run-budget-ecs-task.sh "${cluster}" "$(jq -er '.["runtime-feature-audit"]' <<<"${tasks}")" \
              "${started_by}" "${audit_args}" >/dev/null
          fi
          bucket="$(jq -er '.backup_bucket_name.value' deployment-evidence/rollout-outputs.json)"
          mkdir -p deployment-evidence/runtime-audit
          required_audits=()
          if [[ "${RTMS_CATCHUP}" == run ]]; then
            required_audits+=(rtms-catchup)
          fi
          for name in "${required_audits[@]}"; do
            aws s3 cp "s3://${bucket}/deployment-evidence/runtime-audit/${RELEASE_TAG}/${name}.json" \
              "deployment-evidence/runtime-audit/${name}.json" --only-show-errors
            jq -e --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" \
              '.status == "pass" and .release_tag == $tag and .commit_sha == $sha and .redactions_applied == true' \
              "deployment-evidence/runtime-audit/${name}.json" >/dev/null
            cp "deployment-evidence/runtime-audit/${name}.json" "deployment-evidence/${name}.json"
          done
          if [[ "${RTMS_CATCHUP}" != run ]]; then
            jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{status:"skipped",release_tag:$tag,commit_sha:$sha,created_at:$created_at,
                skipped_reason:"operator disabled the RTMS catch-up audit for this rollout",
                checks:{catchup_executed:false},redactions_applied:true}' \
              >deployment-evidence/rtms-catchup.json
          fi
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:"skipped",release_tag:$tag,commit_sha:$sha,created_at:$created_at,
              reason:"market-news collection is disabled during RTMS production stabilization",
              checks:{bootstrap_executed:false,schedules_enabled:false},redactions_applied:true}' \
            >deployment-evidence/news-bootstrap.json
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_APPLY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Roll ML then application services in dependency order
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          task_definitions="$(jq -ec '.application_task_definition_arns.value' deployment-evidence/rollout-outputs.json)"
          live_desired="$(jq -ec '.desired_counts' deployment-evidence/live-application-service-pins.json)"
          rolled='[]'
          rolled='[{"name":"ml","stable":true}]'
          for service in property-api user-api ai chat-bff admin-api admin-gateway; do
            task_definition="$(jq -er --arg service "${service}" '.[$service]' <<<"${task_definitions}")"
            desired="$(jq -er --arg service "${service}" '.[$service]' <<<"${live_desired}")"
            aws ecs update-service --cluster "${cluster}" --service "${service}" \
              --task-definition "${task_definition}" --desired-count "${desired}" --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster "${cluster}" --services "${service}"
            rolled="$(jq --arg service "${service}" '. + [{name:$service,stable:true}]' <<<"${rolled}")"
          done
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson services "${rolled}" '{status:"partial",release_tag:$tag,commit_sha:$sha,created_at:$created_at,
              checks:{backend_services_stable:true},redactions_applied:true,services:$services}' >deployment-evidence/service-rollout.json
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_DEPLOY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Verify synthetic OAuth redirect contracts without provider login
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"; trap 'find "${work}" -depth -delete' EXIT
          for provider in google kakao naver; do
            case "${provider}" in
              google) expected_host=accounts.google.com ;;
              kakao) expected_host=kauth.kakao.com ;;
              naver) expected_host=nid.naver.com ;;
            esac
            headers="${work}/${provider}.headers"
            status="$(curl --silent --show-error --max-redirs 0 --dump-header "${headers}" --output /dev/null \
              --write-out '%{http_code}' "https://homesearch.world/oauth2/authorization/${provider}")"
            [[ "${status}" == 302 || "${status}" == 303 || "${status}" == 307 ]]
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "${headers}")"
            redirect_host="${location#*://}"; redirect_host="${redirect_host%%/*}"; redirect_host="${redirect_host%%:*}"
            [[ "${redirect_host}" == "${expected_host}" ]]
            callback_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://homesearch.world/login/oauth2/code/${provider}")"
            [[ "${callback_status}" =~ ^4[0-9]{2}$ ]]
          done
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:"skipped",reason:"routine rollout excludes live provider login acceptance",
              release_tag:$tag,commit_sha:$sha,created_at:$created_at,syntheticContractPassed:true,
              checks:{providers:["google","kakao","naver"],redirects_passed:true,
                invalid_callbacks_controlled:true},redactions_applied:true}' \
            >deployment-evidence/oauth-smoke.json
      - name: Smoke backend search before public gateway
        run: |
          set -Eeuo pipefail
          body="$(mktemp)"; concurrent="$(mktemp -d)"; trap 'unlink "${body}"; find "${concurrent}" -depth -delete' EXIT
          result="$(curl --silent --show-error --get --output "${body}" --write-out '%{http_code} %{time_total}' \
            --data-urlencode 'q=마포' https://homesearch.world/api/v1/search/complexes)"
          read -r code elapsed <<<"${result}"
          [[ "${code}" == 200 ]] && jq -e 'type == "array"' "${body}" >/dev/null
          pids=()
          for request in $(seq 1 20); do
            curl --silent --show-error --get --output /dev/null --write-out '%{http_code}\n' \
              --data-urlencode 'q=마포' https://homesearch.world/api/v1/search/complexes \
              >"${concurrent}/${request}" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "${pid}"; done
          [[ "$(grep -Lx 200 "${concurrent}"/* | wc -l | tr -d ' ')" == 0 ]]
          post_concurrency_code="$(curl --silent --show-error --get --output /dev/null --write-out '%{http_code}' \
            --data-urlencode 'q=마포' https://homesearch.world/api/v1/search/complexes)"
          [[ "${post_concurrency_code}" == 200 ]]
          jq -n --argjson code "${code}" --argjson elapsed "${elapsed}" \
            '{status:"pass",http_status:$code,elapsed_seconds:$elapsed,response_is_array:true,
              concurrent_requests:20,concurrent_5xx:0,post_concurrency_search_passed:true}' \
            >deployment-evidence/backend-search-smoke.json
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_APPLY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Replace public gateway after backend smoke
        run: |
          set -Eeuo pipefail
          service=public-gateway
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          task_definition="$(jq -er '.application_task_definition_arns.value["public-gateway"]' deployment-evidence/rollout-outputs.json)"
          desired="$(jq -er '.desired_counts["public-gateway"]' deployment-evidence/live-application-service-pins.json)"
          aws ecs update-service --cluster "${cluster}" --service "${service}" \
            --task-definition "${task_definition}" --desired-count "${desired}" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "${cluster}" --services "${service}"
          jq '.status="pass" | .services += [{name:"public-gateway",stable:true}]
            | .order=["ml","property-api","user-api","ai","chat-bff","admin-api","admin-gateway","public-gateway"]' \
            deployment-evidence/service-rollout.json >deployment-evidence/service-rollout.next.json
          mv deployment-evidence/service-rollout.next.json deployment-evidence/service-rollout.json
      - name: Reconcile Terraform state and require zero drift
        env:
          RTMS_CATCHUP: "${{ inputs.rtms_catchup }}"
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          export TF_VAR_market_news_schedules_enabled=false
          export TF_VAR_rtms_refresh_schedule_enabled=true
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          new_task_definitions="$(jq -ec '.application_task_definition_arns.value' deployment-evidence/rollout-outputs.json)"
          live_rtms="$(jq -er '.rtms_refresh_task_definition_arn' infra/terraform/budget-production/release.auto.tfvars.json)"
          candidate_rtms="$(jq -er '.one_shot_task_definition_arns.value["rtms-daily-refresh"]' deployment-evidence/rollout-outputs.json)"
          live_rtms_definition="$(aws ecs describe-task-definition --task-definition "${live_rtms}" --query taskDefinition --output json)"
          candidate_rtms_definition="$(aws ecs describe-task-definition --task-definition "${candidate_rtms}" --query taskDefinition --output json)"
          runtime_filter='{taskRoleArn,executionRoleArn,networkMode,cpu,memory,requiresCompatibilities,
            containerDefinitions:[.containerDefinitions[] | {name,image,cpu,memory,memoryReservation,essential,command,entryPoint,environment,secrets,mountPoints}],volumes}'
          live_runtime="$(jq -Sc "${runtime_filter}" <<<"${live_rtms_definition}")"
          candidate_runtime="$(jq -Sc "${runtime_filter}" <<<"${candidate_rtms_definition}")"
          selected_rtms="${live_rtms}"
          if [[ "${candidate_runtime}" != "${live_runtime}" ]]; then
            [[ "${RTMS_CATCHUP}" == run ]]
            jq -e '.status == "pass" and .checks.task_exit_code == 0 and .checks.all_steps_completed == true
              and .checks.raw_first == true and .checks.duplicate_normalized_trades == 0' deployment-evidence/rtms-catchup.json >/dev/null
            selected_rtms="${candidate_rtms}"
          fi
          [[ "${selected_rtms}" =~ ^arn:aws:ecs:ap-northeast-2:[0-9]{12}:task-definition/home-search-budget-production-rtms-daily-refresh:[1-9][0-9]*$ ]]
          final_desired='{}'
          for service in admin-api admin-gateway ai chat-bff ml property-api public-gateway user-api; do
            desired="$(aws ecs describe-services --cluster "${cluster}" --services "${service}" --query 'services[0].desiredCount' --output text)"
            final_desired="$(jq --arg service "${service}" --argjson desired "${desired}" '. + {($service):$desired}' <<<"${final_desired}")"
          done
          jq --argjson task_definitions "${new_task_definitions}" --argjson desired_counts "${final_desired}" \
            --arg rtms_refresh_task_definition_arn "${selected_rtms}" \
            '.application_service_task_definition_arns=$task_definitions
             | .application_service_desired_counts=$desired_counts
             | .rtms_refresh_task_definition_arn=$rtms_refresh_task_definition_arn
             | .market_news_schedules_enabled=false' \
            infra/terraform/budget-production/release.auto.tfvars.json >infra/terraform/budget-production/release.auto.tfvars.next.json
          mv infra/terraform/budget-production/release.auto.tfvars.next.json infra/terraform/budget-production/release.auto.tfvars.json
          terraform -chdir=infra/terraform/budget-production apply -refresh-only -auto-approve
          code=0
          terraform -chdir=infra/terraform/budget-production plan -out=final.tfplan -detailed-exitcode || code=$?
          [[ "${code}" == 0 || "${code}" == 2 ]]
          terraform -chdir=infra/terraform/budget-production show -json final.tfplan >deployment-evidence/remaining-plan.json
          bash infra/deploy/verify-budget-production-rollout-plan.sh \
            deployment-evidence/remaining-plan.json deployment-evidence/live-application-settings.json final
          [[ "${code}" == 0 ]] || terraform -chdir=infra/terraform/budget-production apply -auto-approve final.tfplan
          zero_code=0
          terraform -chdir=infra/terraform/budget-production plan -out=zero.tfplan -detailed-exitcode || zero_code=$?
          [[ "${zero_code}" == 0 ]]
          terraform -chdir=infra/terraform/budget-production show -json zero.tfplan >deployment-evidence/final-zero-drift-plan.json
          final_platform='{}'
          for service in budget-postgres budget-valkey; do
            task_definition="$(aws ecs describe-services --cluster "${cluster}" --services "${service}" --query 'services[0].taskDefinition' --output text)"
            expected_task_definition="$(jq -er --arg service "${service}" '.services[$service].task_definition' deployment-evidence/pre-rollout-platform.json)"
            [[ "${task_definition}" == "${expected_task_definition}" ]]
            image="$(aws ecs describe-task-definition --task-definition "${task_definition}" --query 'taskDefinition.containerDefinitions[0].image' --output text)"
            final_platform="$(jq --arg service "${service}" --arg image "${image}" '. + {($service):$image}' <<<"${final_platform}")"
          done
          jq -e --argjson final "${final_platform}" '.platform_image_uris == $final' deployment-evidence/live-platform-images.json >/dev/null
          jq -n '{platform_unchanged:true,platform_task_definitions_unchanged:true,dns_plan_unchanged:true}' \
            >deployment-evidence/final-invariants.json
          rtms_schedule="$(aws scheduler get-schedule --name home-search-budget-production-rtms-daily-refresh \
            --group-name home-search-budget-production-data-refresh --output json)"
          jq -e '.State == "ENABLED" and .ScheduleExpression == "cron(30 4 * * ? *)"
            and .ScheduleExpressionTimezone == "Asia/Seoul"
            and .Target.RetryPolicy.MaximumRetryAttempts == 0
            and (.Target.Arn | test(":stateMachine:home-search-budget-production-rtms-refresh$"))' <<<"${rtms_schedule}" >/dev/null
          state_machine_arn="$(jq -er '.Target.Arn' <<<"${rtms_schedule}")"
          state_machine_definition="$(aws stepfunctions describe-state-machine --state-machine-arn "${state_machine_arn}" --query definition --output text)"
          scheduled_rtms="$(jq -er '.States.RUN_RTMS.Parameters.TaskDefinition' <<<"${state_machine_definition}")"
          [[ "${scheduled_rtms}" == "${selected_rtms}" ]]
          news_states='[]'
          for schedule in general morning major-selection retention; do
            state="$(aws scheduler get-schedule --name "home-search-budget-production-market-news-${schedule}" \
              --group-name home-search-budget-production-market-news --query State --output text)"
            news_states="$(jq --arg state "${state}" '. + [$state]' <<<"${news_states}")"
          done
          jq -e 'length == 4 and all(.[]; . == "DISABLED")' <<<"${news_states}" >/dev/null
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg task_definition "${scheduled_rtms}" '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,
              checks:{scheduler_state:"ENABLED",schedule_expression:"cron(30 4 * * ? *)",timezone:"Asia/Seoul",
                delivery_retry_attempts:0,target_type:"StepFunctions",immutable_task_definition:$task_definition,
                market_news_schedule_count:4,market_news_schedules_disabled:true},redactions_applied:true}' \
            >deployment-evidence/rtms-schedule.json
      - name: Smoke current homesearch.world DNS without mutation
        run: |
          set -Eeuo pipefail
          body="$(mktemp)"; trap 'unlink "${body}"' EXIT
          result="$(curl --fail-with-body --silent --show-error --get --output "${body}" --write-out '%{http_code} %{time_total}' \
            --data-urlencode 'q=마포래미안푸르지오' https://homesearch.world/api/v1/search/complexes)"
          read -r code elapsed <<<"${result}"
          [[ "${code}" == 200 ]] && jq -e 'type == "array"' "${body}" >/dev/null
          jq -n --argjson code "${code}" --argjson elapsed "${elapsed}" \
            '{status:"pass",http_status:$code,elapsed_seconds:$elapsed,response_is_array:true,dns_mutated:false}' \
            >deployment-evidence/public-search-smoke.json
      - name: Verify integrated news insight prediction and search
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"; trap 'find "${work}" -depth -delete' EXIT
          curl --fail-with-body --silent --show-error --get --data-urlencode 'scope=NATIONWIDE' --data-urlencode 'limit=20' \
            https://homesearch.world/api/v1/insights/news >"${work}/news-nation.json"
          curl --fail-with-body --silent --show-error --get --data-urlencode 'scope=SIDO' --data-urlencode 'regionCode=11' --data-urlencode 'limit=20' \
            https://homesearch.world/api/v1/insights/news >"${work}/news-seoul.json"
          jq -s -e 'all(.[]; (.dataStatus == "FRESH" or .dataStatus == "STALE" or .dataStatus == "UNAVAILABLE")
            and (.items | type == "array"))' "${work}/news-nation.json" "${work}/news-seoul.json" >/dev/null
          curl --fail-with-body --silent --show-error --get --data-urlencode 'scope=SIDO' --data-urlencode 'regionCode=11' --data-urlencode 'limit=20' \
            https://homesearch.world/api/v1/insights/trades/weekly >"${work}/weekly.json"
          curl --fail-with-body --silent --show-error --get --data-urlencode 'scope=NATIONWIDE' --data-urlencode 'limit=20' \
            https://homesearch.world/api/v1/insights/trades/latest >"${work}/latest.json"
          jq -s -e 'all(.[]; .generatedAt and .periodStart and .periodEnd and .dataStatus)' "${work}/weekly.json" "${work}/latest.json" >/dev/null
          curl --fail-with-body --silent --show-error --get --data-urlencode 'q=마포래미안푸르지오' \
            https://homesearch.world/api/v1/search/complexes >"${work}/exact.json"
          curl --fail-with-body --silent --show-error --get --data-urlencode 'q=마포' \
            https://homesearch.world/api/v1/search/complexes >"${work}/prefix.json"
          complex_id="$(jq -er '.[0].complexId' "${work}/exact.json")"
          jq -e 'type == "array" and length > 0' "${work}/prefix.json" >/dev/null
          prediction_ready=false
          for _ in $(seq 1 6); do
            curl --fail-with-body --silent --show-error "https://homesearch.world/api/v1/complex/${complex_id}" >"${work}/detail.json"
            if jq -e '.prediction.status == "READY"
              and (.prediction.predictedDealAmount | type == "number" and . > 0 and . < 1e100)
              and (.prediction.modelVersion | type == "string" and length > 0)' "${work}/detail.json" >/dev/null; then
              prediction_ready=true
              break
            fi
            sleep 5
          done
          [[ "${prediction_ready}" == true ]]
          jq -e '.platform_unchanged == true and .dns_plan_unchanged == true' deployment-evidence/final-invariants.json >/dev/null
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:"pass",release_tag:$tag,commit_sha:$sha,created_at:$created_at,checks:{news_contract_passed:true,
              insight_passed:true,prediction_ready:true,oauth_synthetic_contract_passed:true,search_exact_passed:true,
              search_prefix_passed:true,concurrent_requests:20,concurrent_5xx:0,api_contract_compatible:true,
              platform_unchanged:true},redactions_applied:true}' >deployment-evidence/feature-smoke.json
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_DEPLOY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Observe 15 minute hard gate
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
        run: |
          set -Eeuo pipefail
          samples='[]'; public_5xx=0; http_failures=0; stop_observation=false
          started="$(date -u +%s)"
          started_iso="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          started_ms="$((started * 1000))"
          detail_seed="$(mktemp)"; trap 'unlink "${detail_seed}"' EXIT
          curl --fail-with-body --silent --show-error --get --data-urlencode 'q=마포래미안푸르지오' \
            https://homesearch.world/api/v1/search/complexes >"${detail_seed}"
          complex_id="$(jq -er '.[0].complexId' "${detail_seed}")"
          for sample in $(seq 1 15); do
            exact="$(curl --silent --show-error --get --output /dev/null --write-out '%{http_code} %{time_total}' \
              --data-urlencode 'q=마포래미안푸르지오' https://homesearch.world/api/v1/search/complexes || printf '000 0')"
            prefix="$(curl --silent --show-error --get --output /dev/null --write-out '%{http_code} %{time_total}' \
              --data-urlencode 'q=마포' https://homesearch.world/api/v1/search/complexes || printf '000 0')"
            read -r exact_code exact_time <<<"${exact}"; read -r prefix_code prefix_time <<<"${prefix}"
            if [[ "${exact_code}" != 200 ]]; then http_failures=$((http_failures + 1)); stop_observation=true; fi
            if [[ "${prefix_code}" != 200 ]]; then http_failures=$((http_failures + 1)); stop_observation=true; fi
            for endpoint in \
              'https://homesearch.world/api/v1/insights/news?scope=SIDO&regionCode=11&limit=20' \
              'https://homesearch.world/api/v1/insights/trades/weekly?scope=SIDO&regionCode=11&limit=20' \
              "https://homesearch.world/api/v1/complex/${complex_id}"; do
              endpoint_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${endpoint}" || printf 000)"
              if [[ "${endpoint_code}" != 200 ]]; then http_failures=$((http_failures + 1)); stop_observation=true; fi
              [[ "${endpoint_code}" != 5* ]] || public_5xx=$((public_5xx + 1))
            done
            [[ "${exact_code}" != 5* ]] || public_5xx=$((public_5xx + 1))
            [[ "${prefix_code}" != 5* ]] || public_5xx=$((public_5xx + 1))
            samples="$(jq --argjson exact "${exact_time}" --argjson prefix "${prefix_time}" '. + [{exact:$exact,prefix:$prefix}]' <<<"${samples}")"
            [[ "${stop_observation}" == false ]] || break
            sleep 60
          done
          duration=$(( ($(date -u +%s) - started) / 60 ))
          exact_p95="$(jq -r '[.[].exact] | sort | .[((length - 1) * 0.95 | floor)]' <<<"${samples}")"
          prefix_p95="$(jq -r '[.[].prefix] | sort | .[((length - 1) * 0.95 | floor)]' <<<"${samples}")"
          instance_id="$(jq -er '.host_instance_id.value' deployment-evidence/rollout-outputs.json)"
          start_time="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"; end_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cpu="$(aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name CPUUtilization \
            --dimensions Name=InstanceId,Value="${instance_id}" --start-time "${start_time}" --end-time "${end_time}" \
            --period 300 --statistics Maximum --output json | jq -er '[.Datapoints[].Maximum] | max')"
          memory="$(aws cloudwatch get-metric-statistics --namespace HomeSearch/BudgetProduction --metric-name mem_used_percent \
            --dimensions Name=InstanceId,Value="${instance_id}" --start-time "${start_time}" --end-time "${end_time}" \
            --period 300 --statistics Maximum --output json | jq -er '[.Datapoints[].Maximum] | max')"
          cluster="$(jq -er '.ecs_cluster_name.value' deployment-evidence/rollout-outputs.json)"
          services=(admin-api admin-gateway ai chat-bff ml property-api public-gateway user-api)
          service_state="$(aws ecs describe-services --cluster "${cluster}" --services "${services[@]}" --output json)"
          readiness_failures="$(jq '[.failures | length,
            ([.services[] | select(.pendingCount != 0 or .runningCount != .desiredCount)] | length)] | add' <<<"${service_state}")"
          stopped_arns="$(aws ecs list-tasks --cluster "${cluster}" --desired-status STOPPED --max-results 100 --output json)"
          stopped_task_failures=0
          if [[ "$(jq '.taskArns | length' <<<"${stopped_arns}")" -gt 0 ]]; then
            stopped_tasks="$(aws ecs describe-tasks --cluster "${cluster}" --tasks $(jq -r '.taskArns[]' <<<"${stopped_arns}") --output json)"
            stopped_task_failures="$(jq --arg started "${started_iso}" '[.tasks[]
              | select((.stoppedAt // "") >= $started)
              | select(any(.containers[]; (.exitCode // 0) != 0))] | length' <<<"${stopped_tasks}")"
          fi
          tasks="$(jq -ec '.one_shot_task_definition_arns.value' deployment-evidence/rollout-outputs.json)"
          log_audit_args="$(jq -cn --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg start "${started_ms}" '[$tag,$sha,$start]')"
          infra/deploy/run-budget-ecs-task.sh "${cluster}" "$(jq -er '.["runtime-log-audit"]' <<<"${tasks}")" \
            "budget-${GITHUB_RUN_ID}" "${log_audit_args}" >/dev/null
          bucket="$(jq -er '.backup_bucket_name.value' deployment-evidence/rollout-outputs.json)"
          aws s3 cp "s3://${bucket}/deployment-evidence/runtime-audit/${RELEASE_TAG}/runtime-log-audit.json" \
            deployment-evidence/runtime-log-audit.json --only-show-errors
          jq -e --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" \
            '.release_tag == $tag and .commit_sha == $sha and .redactions_applied == true' \
            deployment-evidence/runtime-log-audit.json >/dev/null
          secret_exposure_findings="$(jq -er '.checks.secret_exposure_findings' deployment-evidence/runtime-log-audit.json)"
          statement_timeouts="$(jq -er '.checks.statement_timeouts' deployment-evidence/runtime-log-audit.json)"
          jq -n --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson duration "${duration}" --argjson count "$(jq 'length' <<<"${samples}")" \
            --argjson errors "${public_5xx}" --argjson http_failures "${http_failures}" --argjson crashes "${stopped_task_failures}" \
            --argjson readiness "${readiness_failures}" --argjson exposures "${secret_exposure_findings}" \
            --argjson timeouts "${statement_timeouts}" --argjson exact "${exact_p95}" --argjson prefix "${prefix_p95}" \
            --argjson cpu "${cpu}" --argjson memory "${memory}" \
            '{status:(if $duration >= 15 and $count >= 15 and $http_failures == 0 and $crashes == 0 and $readiness == 0
                and $exposures == 0 and $timeouts == 0 then "pass" else "fail" end),
              release_tag:$tag,commit_sha:$sha,created_at:$created_at,duration_minutes:$duration,samples:$count,
              checks:{hard_gate_minutes:15,public_5xx:$errors,task_crashes:$crashes,readiness_failures:$readiness,
                http_failures:$http_failures,secret_exposure_findings:$exposures,platform_changes:0},
              exact_p95_seconds:$exact,prefix_p95_seconds:$prefix,cpu_max_percent:$cpu,memory_max_percent:$memory,
              hikari_max_connections:8,statement_timeouts:$timeouts,p95_and_resources_are_observation_only:true,redactions_applied:true}' \
            >deployment-evidence/observation.json
          jq -e '.status == "pass" and .duration_minutes >= 15 and .samples >= 15 and .checks.http_failures == 0 and .checks.public_5xx == 0
            and .checks.task_crashes == 0 and .checks.readiness_failures == 0
            and .checks.secret_exposure_findings == 0 and .statement_timeouts == 0' deployment-evidence/observation.json >/dev/null
      - name: Build BUDGET_PRODUCTION_INCREMENTAL_READY.json
        env: { SECURITY_AUDIT_RESULT: "${{ inputs.security_audit_result }}" }
        run: |
          set -Eeuo pipefail
          bash infra/deploy/build-budget-production-incremental-ready-evidence.sh deployment-evidence \
            deployment-evidence/BUDGET_PRODUCTION_INCREMENTAL_READY.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "BUDGET_PRODUCTION_INCREMENTAL_READY-${{ inputs.release_tag }}", path: deployment-evidence/, if-no-files-found: error, retention-days: 365, overwrite: true }

  rollback:
    name: budget-production-incremental-rollback
    needs: rollout
    if: failure() && needs.rollout.result == 'failure' && needs.rollout.outputs.rollback_ready == 'true'
    environment: budget-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { name: "budget-production-incremental-progress-${{ inputs.release_tag }}", path: deployment-evidence }
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with: { role-to-assume: "${{ vars.AWS_BUDGET_PRODUCTION_APPLY_ROLE_ARN }}", aws-region: ap-northeast-2, unset-current-credentials: true }
      - name: Restore every previous application revision
        run: |
          set -Eeuo pipefail
          infra/deploy/disable-runtime-schedules.sh
          infra/deploy/rollback-services.sh deployment-evidence/pre-rollout-services.json
