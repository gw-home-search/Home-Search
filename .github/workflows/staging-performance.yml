name: Staging performance evidence

on:
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-performance
  cancel-in-progress: false

jobs:
  k6-evidence:
    name: k6-map-p0-gate
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Link latest successful staging release manifest
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${SOURCE_RUN_ID}" ]]; then
            run_id="${SOURCE_RUN_ID}"
          else
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow deploy-staging.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          mkdir -p performance-evidence/deployment
          if [[ -z "${run_id}" ]]; then
            jq -n --arg measured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{status:"not run",reason:"successful staging deployment not found",measured_at:$measured_at}' \
              >performance-evidence/not-run.json
            echo 'available=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'staging-deployment-*' --dir performance-evidence/deployment
          manifest="$(find performance-evidence/deployment -type f -name staging-release-manifest.json -print -quit)"
          [[ -n "${manifest}" ]]
          cp "${manifest}" performance-evidence/staging-release-manifest.json
          echo 'available=true' >>"${GITHUB_OUTPUT}"

      - name: Run map and prediction regression probes
        id: k6
        if: steps.deployment.outputs.available == 'true'
        env:
          BASE_URL: ${{ vars.STAGING_PUBLIC_ORIGIN }}
          MAP_BOUNDS_JSON: ${{ vars.STAGING_PERF_MAP_BOUNDS_JSON }}
          READY_COMPLEX_ID: ${{ vars.STAGING_PERF_READY_COMPLEX_ID }}
          MISS_COMPLEX_ID: ${{ vars.STAGING_PERF_MISS_COMPLEX_ID }}
          # Committed from the latest measured baseline in
          # apps/property-data/perf/map-marker-performance-analysis.md.
          EXPECTED_PEAK_RPS: "1"
          MAP_MARKER_EXPECTED_COUNT: ${{ vars.STAGING_MAP_MARKER_EXPECTED_COUNT }}
          MAP_MARKER_CANONICAL_SHA256: ${{ vars.STAGING_MAP_MARKER_CANONICAL_SHA256 }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/work" --workdir /work \
            --env BASE_URL --env MAP_BOUNDS_JSON --env READY_COMPLEX_ID --env MISS_COMPLEX_ID \
            --env EXPECTED_PEAK_RPS \
            --env MAP_MARKER_EXPECTED_COUNT --env MAP_MARKER_CANONICAL_SHA256 \
            grafana/k6@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c \
            run --out json=performance-evidence/k6-points.json performance/staging/map-prediction.js

      - name: Record evidence-only baseline metadata
        if: always()
        env:
          K6_OUTCOME: ${{ steps.k6.outcome }}
        run: |
          if [[ -f performance-evidence/staging-release-manifest.json ]]; then
            release_tag="$(jq -r '.tag' performance-evidence/staging-release-manifest.json)"
            release_sha="$(jq -r '.commit_sha' performance-evidence/staging-release-manifest.json)"
            jq -n --arg release_tag "${release_tag}" --arg release_sha "${release_sha}" \
              --arg outcome "${K6_OUTCOME}" --arg measured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{mode:"release-gate",merge_gate:true,release_tag:$release_tag,release_sha:$release_sha,
                k6_outcome:$outcome,measured_at:$measured_at,expected_peak_rps:1,expected_peak_multiplier:2,
                map_p95_limit_ms:2000,error_rate_limit:0.01,cold_samples_minimum:3,
                marker_parity_required:true,
                cold_definition:"three unique cache keys; projection database path is always generation-scoped"}' \
              >performance-evidence/metadata.json
          else
            cp performance-evidence/not-run.json performance-evidence/metadata.json
          fi

      - name: Upload performance evidence linked to release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-performance-${{ github.run_id }}
          path: performance-evidence/
          if-no-files-found: error
          retention-days: 90
