server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
spring:
  flyway:
    enabled: false
  session:
    jdbc:
      initialize-schema: never
      table-name: admin.spring_session
  datasource:
    url: ${ADMIN_DB_JDBC_URL}
    username: ${ADMIN_DB_USERNAME}
    password: ${ADMIN_DB_PASSWORD}
home:
  admin:
    session:
      absolute-lifetime: 8h
    internal:
      enabled: ${ADMIN_INTERNAL_ENABLED:false}
      issuer: ${ADMIN_INTERNAL_JWT_ISSUER:admin-service}
      audience: ${ADMIN_INTERNAL_JWT_AUDIENCE:property-data-admin}
      token-lifetime: ${ADMIN_INTERNAL_JWT_LIFETIME:60s}
      key-id: ${ADMIN_INTERNAL_JWT_KEY_ID:}
      private-key-path: ${ADMIN_INTERNAL_JWT_PRIVATE_KEY_PATH:}
      property-data-base-url: ${PROPERTY_DATA_INTERNAL_BASE_URL:http://localhost:8080}
      connect-timeout: ${PROPERTY_DATA_INTERNAL_CONNECT_TIMEOUT:2s}
      read-timeout: ${PROPERTY_DATA_INTERNAL_READ_TIMEOUT:10s}
