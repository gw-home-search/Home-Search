name: home-search-coordinate-source

services:
  coordinate-source-postgis:
    image: postgis/postgis:16-3.4
    container_name: home-search-coordinate-source-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${COORDINATE_SOURCE_TARGET_DB_NAME:-home_search_coordinate_source_v2}
      POSTGRES_USER: ${COORDINATE_SOURCE_TARGET_DB_USERNAME:-home_search}
      POSTGRES_PASSWORD: ${COORDINATE_SOURCE_TARGET_DB_PASSWORD:-home_search_local_password}
    ports:
      - "${COORDINATE_SOURCE_TARGET_DB_PORT:-15433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - source-postgis-data:/var/lib/postgresql/data
    networks:
      - home-search-local

volumes:
  source-postgis-data:
    name: ${COORDINATE_SOURCE_TARGET_VOLUME_NAME:-home-search-coordinate-source-data-v2}

networks:
  home-search-local:
    external: true
    name: home-search-local_home-search-local
