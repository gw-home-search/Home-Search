pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'home-search-api'

includeBuild('../../libs/rtms-ingest-core') {
    dependencySubstitution {
        substitute module('com.home:rtms-ingest-core') using project(':')
    }
}
