plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'java'
    id 'jacoco'
}

group = 'com.home'
version = '0.0.1-SNAPSHOT'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
    implementation 'com.home:user-auth-contract'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.96.0')
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
jacoco { toolVersion = '0.8.13' }

tasks.named('bootJar') { archiveFileName = 'chat-bff.jar' }

tasks.register('chatBffTest') { dependsOn tasks.named('test') }
tasks.register('chatBffApiContractTest') { dependsOn tasks.named('test') }
tasks.register('chatBffLibraryTest') {
    dependsOn gradle.includedBuild('security-jwt-core').task(':test')
    dependsOn gradle.includedBuild('user-auth-contract').task(':test')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports { xml.required = true; html.required = true }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.90 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.65 }
        }
    }
}

tasks.register('chatBffQualityCheck') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('chatBffTest')
    dependsOn tasks.named('chatBffApiContractTest')
    dependsOn tasks.named('chatBffLibraryTest')
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn tasks.named('bootJar')
}
