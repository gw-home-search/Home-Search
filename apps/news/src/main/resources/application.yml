home:
  news:
    enabled: false
    region-month-signals:
      enabled: false
      mode: ${HOME_NEWS_REGION_MONTH_SIGNAL_MODE:GENERATE_CSV_REGION_MONTH_SIGNALS}
      period-start: ${HOME_NEWS_REGION_MONTH_SIGNAL_PERIOD_START:2017-01-01}
      period-end: ${HOME_NEWS_REGION_MONTH_SIGNAL_PERIOD_END:2026-05-31}
      method-version: ${HOME_NEWS_REGION_MONTH_SIGNAL_METHOD_VERSION:region-month-signal-v1}
      csv-input-dir: ${HOME_NEWS_REGION_MONTH_SIGNAL_CSV_INPUT_DIR:apps/news/local-input/historical-news-csv}
      web-worklist-path: ${HOME_NEWS_REGION_MONTH_SIGNAL_WEB_WORKLIST_PATH:apps/news/local-input/region-month-signal-web-worklist.jsonl}
      web-research-path: ${HOME_NEWS_REGION_MONTH_SIGNAL_WEB_RESEARCH_PATH:apps/news/local-input/region-month-signal-web-research.jsonl}
      generated-csv-signals-path: ${HOME_NEWS_REGION_MONTH_SIGNAL_CSV_OUTPUT_PATH:apps/news/local-input/region-month-signal-bigkinds.csv.jsonl}
      obsidian-output-dir: ${HOME_NEWS_REGION_MONTH_SIGNAL_OBSIDIAN_OUTPUT_DIR:news-research-seed/obsidian}

spring:
  application:
    name: home-search-news
  flyway:
    enabled: false
