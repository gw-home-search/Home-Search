plugins {
    id 'org.springframework.boot'
    id 'org.asciidoctor.jvm.convert'
    id 'com.epages.restdocs-api-spec'
}

description = 'Home Search property-data API app'

asciidoctorj {
    version = '3.0.0'
}

tasks.named('bootJar') {
    archiveFileName = 'property-data-api.jar'
}

configurations {
    asciidoctorExt
}

def forbiddenApiCompileModules = [
    'org.springframework:spring-jdbc',
    'org.springframework.data:spring-data-redis',
    'org.springframework.boot:spring-boot-starter-jdbc',
    'org.springframework.boot:spring-boot-starter-data-redis'
] as Set

tasks.register('verifyApiCompileClasspathBoundary') {
    description = 'Fail when JDBC or Redis persistence artifacts enter the API compile classpath.'
    group = 'verification'

    doLast {
        def resolved = configurations.compileClasspath.resolvedConfiguration
        def violations = resolved.resolvedArtifacts.findAll { artifact ->
            def id = artifact.moduleVersion.id
            forbiddenApiCompileModules.contains("${id.group}:${id.name}".toString())
        }.sort { left, right -> left.moduleVersion.id.toString() <=> right.moduleVersion.id.toString() }

        if (!violations.isEmpty()) {
            logger.error('API compileClasspath contains forbidden persistence artifacts:')
            violations.each { artifact ->
                def violationId = artifact.moduleVersion.id
                logger.error("- ${violationId}")
                def visit
                visit = { dependency, List<String> path ->
                    def current = "${dependency.moduleGroup}:${dependency.moduleName}:${dependency.moduleVersion}"
                    def nextPath = path + current
                    if (dependency.moduleGroup == violationId.group && dependency.moduleName == violationId.name) {
                        logger.error("  path: ${nextPath.join(' -> ')}")
                    }
                    dependency.children.each { child -> visit(child, nextPath) }
                }
                resolved.firstLevelModuleDependencies.each { dependency -> visit(dependency, []) }
            }
            throw new GradleException('API compile classpath boundary violated')
        }
    }
}

tasks.register('verifyApiRuntimeDatabaseBoundary') {
    description = 'Fail when Flyway or migration resources enter the API runtime artifact.'
    group = 'verification'
    dependsOn tasks.named('bootJar')
    dependsOn project(':core').tasks.named('jar')

    doLast {
        def flywayArtifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group == 'org.flywaydb'
        }
        if (!flywayArtifacts.isEmpty()) {
            throw new GradleException("API runtime must not include Flyway: ${flywayArtifacts*.moduleVersion*.id}")
        }

        def apiJar = tasks.named('bootJar').get().archiveFile.get().asFile
        def apiMigrationResources = zipTree(apiJar).matching { include 'BOOT-INF/classes/db/migration/**' }.files
        if (!apiMigrationResources.isEmpty()) {
            throw new GradleException("API artifact contains migration resources: ${apiMigrationResources}")
        }

        def coreJar = project(':core').tasks.named('jar').get().archiveFile.get().asFile
        def coreMigrationResources = zipTree(coreJar).matching { include 'db/migration/**' }.files
        if (!coreMigrationResources.isEmpty()) {
            throw new GradleException("Core runtime artifact contains migration resources: ${coreMigrationResources}")
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.home:security-jwt-core'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    runtimeOnly 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'org.flywaydb:flyway-core'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
}

ext {
    snippetsDir = file('build/generated-snippets')
}

tasks.named('test') {
    exclude '**/infrastructure/web/**/*ContractTest.class'
    exclude '**/*RestDocsTest.class'
}

tasks.withType(Test).configureEach {
    systemProperty 'propertyDataMigrationLocation',
        "filesystem:${rootProject.layout.projectDirectory.dir('db/migration/api').asFile.absolutePath}"
}

tasks.named('check') {
    dependsOn tasks.named('verifyApiCompileClasspathBoundary')
    dependsOn tasks.named('verifyApiRuntimeDatabaseBoundary')
}

tasks.register('apiContractTest', Test) {
    description = 'Run public API controller and DTO contract tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/infrastructure/web/**/*ContractTest.class'
}

tasks.register('restDocsTest', Test) {
    description = 'Generate Spring REST Docs snippets and API spec resource snippets.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.dir snippetsDir
    useJUnitPlatform {
        includeTags 'restDocs'
    }
}

tasks.named('asciidoctor') {
    dependsOn tasks.named('restDocsTest')
    inputs.dir snippetsDir
    configurations 'asciidoctorExt'
}

openapi3 {
    server = 'http://localhost:8080'
    title = 'Home Search public API'
    description = 'Home Search map and trade-data API generated from REST Docs tests.'
    version = project.version.toString()
    format = 'yaml'
}

tasks.matching { it.name == 'openapi3' }.configureEach {
    dependsOn tasks.named('restDocsTest')
}

tasks.register('verifyOpenApiSpec') {
    description = 'Verify generated OpenAPI YAML exposes only the public map API contract.'
    group = 'verification'
    dependsOn tasks.named('openapi3')

    doLast {
        def specFile = layout.buildDirectory.file('api-spec/openapi3.yaml').get().asFile
        if (!specFile.exists()) {
            throw new GradleException("OpenAPI spec was not generated: ${specFile}")
        }

        def content = specFile.getText('UTF-8')
        def requiredTokens = [
            '/api/v1/map/regions',
            '/api/v1/map/complexes',
            '/api/v1/search/complexes',
            '/api/v1/search/complexes/suggestions',
            '/api/v1/region',
            '/api/v1/region/{regionId}/complexes',
            '/api/v1/detail/{parcelId}',
            '/api/v1/detail/{parcelId}/complexes',
            '/api/v1/complex/{complexId}',
            '/api/v1/complex/{complexId}/trades',
            '/api/v1/trade/{parcelId}',
            '/api/v1/insights/trades/latest',
            '/api/v1/insights/trades/weekly',
            'complexId',
            'complexName',
            'parcelId',
            'lat',
            'lng',
            'latestDealAmount',
            'unitCntSum',
            'dealAmount',
            'exception',
            'timestamp'
        ]
        requiredTokens.each { token ->
            if (!content.contains(token)) {
                throw new GradleException("OpenAPI spec is missing required token: ${token}")
            }
        }

        def forbiddenPublicFields = ['complex_pk', 'complexPk', 'apt_seq', 'aptSeq', 'source_key', 'sourceKey']
        forbiddenPublicFields.each { field ->
            if ((content =~ /(?m)^\s+${field}\s*:/).find()) {
                throw new GradleException("OpenAPI spec exposes internal audit field: ${field}")
            }
        }
    }
}

tasks.register('apiDocsCheck') {
    description = 'Generate and verify REST Docs HTML and OpenAPI YAML artifacts.'
    group = 'verification'
    dependsOn tasks.named('restDocsTest')
    dependsOn tasks.named('asciidoctor')
    dependsOn tasks.named('verifyOpenApiSpec')
}
