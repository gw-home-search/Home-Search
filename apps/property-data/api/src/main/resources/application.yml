spring:
  application:
    name: home-search-api
  profiles:
    default: local
  flyway:
    enabled: false

apis:
  data:
    base-url: https://apis.data.go.kr
    apt-service-key: "${APT_SERVICE_KEY:}"
    apt-title-path: /1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev
    apt-num-of-rows: 1000
    connect-timeout-millis: 5000
    read-timeout-millis: 5000
    min-request-interval-millis: 200

vworld:
  data:
    base-url: https://api.vworld.kr
    vw-service-key: "${VW_SERVICE_KEY:}"
    vm-domain: "${VWORLD_DOMAIN:http://localhost:8080/only-local-test}"
    vm-wfs-path: /ned/wfs/getBldgisSpceWFS
    num-of-rows: 100
    connect-timeout-millis: 5000
    read-timeout-millis: 5000

management:
  health:
    redis:
      enabled: false

home:
  region:
    sync:
      one-shot:
        enabled: false
  map:
    marker-cache:
      enabled: false
      ttl: 5m
  prediction:
    enabled: true
    model-version: deployment__F37_monthly_anchor_prev3_rolling_huber_010
    zone: Asia/Seoul
    cache:
      ttl: 24h
      pending-ttl: 60s
      failed-ttl: 10m
      unavailable-ttl: 1h
      lock-ttl: 60s
    client:
      base-url: http://localhost:8001
      connect-timeout-millis: 1000
      read-timeout-millis: 3000
    interval:
      pct: 0.188077
      basis: recent_holdout_p95
  admin:
    internal:
      enabled: ${HOME_ADMIN_INTERNAL_ENABLED:false}
      issuer: ${HOME_ADMIN_INTERNAL_ISSUER:admin-service}
      audience: ${HOME_ADMIN_INTERNAL_AUDIENCE:property-data-admin}
      maximum-lifetime: ${HOME_ADMIN_INTERNAL_MAXIMUM_LIFETIME:60s}
      public-keys: ${HOME_ADMIN_INTERNAL_PUBLIC_KEYS:}
  coordinate:
    vworld-fallback:
      enabled: false
  ingest:
    rtms:
      allow-coordinate-pending-only: false
      refresh-retry-attempts: 3
      refresh-retry-backoff-millis: 250
  trade:
    partition:
      maintenance:
        enabled: false
