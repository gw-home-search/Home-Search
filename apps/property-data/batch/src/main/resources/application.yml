spring:
  application:
    name: home-search-batch
  profiles:
    default: local
  main:
    web-application-type: none
    lazy-initialization: true
  datasource:
    url: "${DB_JDBC_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: "${SPRING_DATA_REDIS_HOST:localhost}"
      port: "${SPRING_DATA_REDIS_PORT:6379}"
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: batch.BATCH_
  flyway:
    enabled: false

apis:
  data:
    base-url: https://apis.data.go.kr
    apt-service-key: "${APT_SERVICE_KEY:}"
    apt-title-path: /1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev
    building-title-path: /1613000/BldRgstHubService/getBrTitleInfo
    building-recap-title-path: /1613000/BldRgstHubService/getBrRecapTitleInfo
    apt-num-of-rows: 1000
    connect-timeout-millis: 5000
    read-timeout-millis: 5000
    min-request-interval-millis: 200

home:
  news:
    naver:
      enabled: "${HOME_NEWS_NAVER_ENABLED:false}"
      provider-mode: "${HOME_NEWS_NAVER_PROVIDER_MODE:API_HUB}"
      client-id: "${HOME_NEWS_NAVER_CLIENT_ID:${NAVER_NEWS_API_KEY_ID:}}"
      client-secret: "${HOME_NEWS_NAVER_CLIENT_SECRET:${NAVER_NEWS_API_KEY:}}"
      base-url: "${HOME_NEWS_NAVER_BASE_URL:https://naverapihub.apigw.ntruss.com}"
      path: "${HOME_NEWS_NAVER_PATH:/search/v1/news}"
      daily-call-budget: "${HOME_NEWS_DAILY_CALL_BUDGET:4000}"
      cache-enabled: "${HOME_NEWS_CACHE_ENABLED:true}"
      cache-ttl: "${HOME_NEWS_CACHE_TTL:31d}"
      connect-timeout: "${HOME_NEWS_CONNECT_TIMEOUT:2s}"
      read-timeout: "${HOME_NEWS_READ_TIMEOUT:5s}"
  insight:
    trade:
      enabled: "${HOME_INSIGHT_TRADE_ENABLED:false}"
  ops:
    hermes:
      enabled: false
      url: "${HERMES_SLACK_URL:}"
      auth-token: "${HERMES_AUTH_TOKEN:}"
      channel: "${HERMES_SLACK_CHANNEL:}"
      connect-timeout-millis: 3000
      read-timeout-millis: 3000
  coordinate-source:
    db:
      jdbc-url: "${COORDINATE_SOURCE_DB_JDBC_URL:}"
      username: "${COORDINATE_SOURCE_DB_USERNAME}"
      password: "${COORDINATE_SOURCE_DB_PASSWORD}"
  ingest:
    raw-reconcile:
      enabled: false
    match-rematch:
      enabled: false
    rtms:
      allow-coordinate-pending-only: false
      refresh-retry-attempts: 3
      refresh-retry-backoff-millis: 250
      daily:
        enabled: false
        lawd-cds: ""
        lookback-months: 2
        zone: Asia/Seoul
  trade:
    partition:
      maintenance:
        enabled: false
  coordinate:
    readiness:
      enabled: false
complex:
  metadata:
    daily-request-quota: 1000
    min-request-interval-millis: 250
    enrich:
      enabled: false
      scheduler:
        enabled: false
