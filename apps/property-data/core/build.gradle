plugins {
    id 'java-library'
}

dependencies {
    api 'com.home:rtms-ingest-core:0.0.1-SNAPSHOT'
    api 'org.springframework:spring-tx'

    implementation 'io.micrometer:micrometer-core'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.data:spring-data-redis'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-web'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
}

tasks.named('test') {
    exclude '**/infrastructure/persistence/**/*Test.class'
    exclude '**/*JdbcIntegrationTest.class'
}

tasks.withType(Test).configureEach {
    systemProperty 'propertyDataMigrationLocation',
        "filesystem:${rootProject.layout.projectDirectory.dir('db/migration/api').asFile.absolutePath}"
}

tasks.register('persistenceTest', Test) {
    description = 'Run Flyway/JDBC/PostGIS persistence tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/infrastructure/persistence/**/*Test.class'
    include '**/*JdbcIntegrationTest.class'
}
