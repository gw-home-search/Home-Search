plugins {
    id 'org.springframework.boot'
}

description = 'Home Search property-data explicit migration app'

dependencies {
    implementation project(':core')

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('bootJar') {
    archiveFileName = 'property-data-migration.jar'
}

tasks.register('printMigrationBootJarPath') {
    description = 'Build the migration boot jar and print its absolute archive path.'
    group = 'build'
    dependsOn tasks.named('bootJar')

    doLast {
        println "MIGRATION_BOOT_JAR=${tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath}"
    }
}

tasks.register('packagedProcessSmoke', Exec) {
    description = 'Verify packaged migration process exit codes without changing a database.'
    group = 'verification'
    dependsOn tasks.named('bootJar')
    workingDir rootProject.projectDir
    commandLine 'bash', 'ops/verify-migration-packaged-process.sh'
    environment 'PROPERTY_DATA_MIGRATION_JAR', tasks.named('bootJar').flatMap { it.archiveFile }.get().asFile.absolutePath
}

tasks.named('check') {
    dependsOn tasks.named('packagedProcessSmoke')
}
