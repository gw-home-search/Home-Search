services:
  batch:
    image: eclipse-temurin:17-jdk
    depends_on:
      postgis:
        condition: service_healthy
    working_dir: /workspace/apps/property-data
    command:
      - "./ops/run-batch-jar.sh"
      - "runDate=${BATCH_RUN_DATE:?BATCH_RUN_DATE is required}"
      - "requestId=${BATCH_REQUEST_ID:?BATCH_REQUEST_ID is required}"
    environment:
      PROPERTY_DATA_BATCH_JAR: /app/property-data-batch.jar
      SPRING_PROFILES_ACTIVE: local
      SPRING_BATCH_JOB_NAME: "rtmsDailyRefreshJob"
      DB_JDBC_URL: jdbc:postgresql://postgis:5432/${HOME_SEARCH_DB_NAME:-home_search}
      DB_USERNAME: ${HOME_SEARCH_DB_USERNAME:-home_search}
      DB_PASSWORD: ${HOME_SEARCH_DB_PASSWORD:-home_search_local_password}
      COORDINATE_SOURCE_DB_HOST: ${COORDINATE_SOURCE_DB_HOST:-home-search-coordinate-source-postgis-arm64-v4}
      COORDINATE_SOURCE_DB_NAME: ${COORDINATE_SOURCE_DB_NAME:-home_search_coordinate_source}
      COORDINATE_SOURCE_DB_JDBC_URL: ${COORDINATE_SOURCE_DB_JDBC_URL:-jdbc:postgresql://${COORDINATE_SOURCE_DB_HOST:-home-search-coordinate-source-postgis-arm64-v4}:5432/${COORDINATE_SOURCE_DB_NAME:-home_search_coordinate_source}}
      COORDINATE_SOURCE_DB_USERNAME: ${COORDINATE_SOURCE_DB_USERNAME:?COORDINATE_SOURCE_DB_USERNAME is required}
      COORDINATE_SOURCE_DB_PASSWORD: ${COORDINATE_SOURCE_DB_PASSWORD:?COORDINATE_SOURCE_DB_PASSWORD is required}
      HOME_INGEST_RTMS_ALLOW_COORDINATE_PENDING_ONLY: ${HOME_INGEST_RTMS_ALLOW_COORDINATE_PENDING_ONLY:-false}
      HOME_INGEST_RTMS_DAILY_LAWD_CDS: "11680,11710,11650"
      HOME_OPS_HERMES_ENABLED: "true"
      APT_SERVICE_KEY: ${APT_SERVICE_KEY:-}
      HERMES_SLACK_URL: ${HERMES_SLACK_URL:-}
      HERMES_AUTH_TOKEN: ${HERMES_AUTH_TOKEN:-}
      HERMES_SLACK_CHANNEL: ${HERMES_SLACK_CHANNEL:-}
    volumes:
      - ..:/workspace
      - ${PROPERTY_DATA_BATCH_JAR:?PROPERTY_DATA_BATCH_JAR is required}:/app/property-data-batch.jar:ro
    networks:
      - home-search-local
