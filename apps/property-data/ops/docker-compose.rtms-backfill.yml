name: home-search-rtms-backfill

services:
  batch:
    image: eclipse-temurin:21-jdk
    working_dir: /app
    command:
      - /app/run-batch-jar.sh
      - fromYmd=${BATCH_FROM_YMD:?BATCH_FROM_YMD is required}
      - toYmd=${BATCH_TO_YMD:?BATCH_TO_YMD is required}
      - lawdCds=${BATCH_LAWD_CDS:?BATCH_LAWD_CDS is required}
      - requestId=${BATCH_REQUEST_ID:?BATCH_REQUEST_ID is required}
    environment:
      PROPERTY_DATA_BATCH_JAR: /app/property-data-batch.jar
      SPRING_PROFILES_ACTIVE: local
      SPRING_BATCH_JOB_NAME: rtmsBackfillJob
      DB_JDBC_URL: jdbc:postgresql://home-search-postgis:5432/home_search
      DB_USERNAME: ${DB_USERNAME:-home_search_property_runtime}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      COORDINATE_SOURCE_DB_JDBC_URL: ${COORDINATE_SOURCE_DB_JDBC_URL:-jdbc:postgresql://home-search-coordinate-source-postgis-arm64-v4:5432/home_search_coordinate_source}
      COORDINATE_SOURCE_DB_USERNAME: ${COORDINATE_SOURCE_DB_USERNAME:-home_search_coordinate_reader}
      COORDINATE_SOURCE_DB_PASSWORD: ${COORDINATE_SOURCE_DB_PASSWORD:?COORDINATE_SOURCE_DB_PASSWORD is required}
      HOME_INGEST_RTMS_ALLOW_COORDINATE_PENDING_ONLY: "false"
      HOME_OPS_HERMES_ENABLED: "false"
      APT_SERVICE_KEY: ${APT_SERVICE_KEY:?APT_SERVICE_KEY is required}
    volumes:
      - ./ops/run-batch-jar.sh:/app/run-batch-jar.sh:ro
      - ${PROPERTY_DATA_BATCH_JAR:?PROPERTY_DATA_BATCH_JAR is required}:/app/property-data-batch.jar:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - home-search-local

networks:
  home-search-local:
    external: true
    name: home-search-local_home-search-local
