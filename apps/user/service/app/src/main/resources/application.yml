spring:
  application:
    name: home-search-user-service
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 90s
  datasource:
    url: ${USER_DB_JDBC_URL}
    username: ${USER_DB_USERNAME:home_search_user_runtime}
    password: ${USER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: 10m
    jdbc:
      initialize-schema: never
      table-name: users.oauth_session
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:UNSET}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:UNSET}
            scope: openid,profile,email
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            scope: profile_nickname
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
          naver:
            client-id: ${NAVER_OAUTH_CLIENT_ID:UNSET}
            client-secret: ${NAVER_OAUTH_CLIENT_SECRET:UNSET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

home:
  auth:
    allowed-origin: ${USER_ALLOWED_ORIGIN}
    refresh-ttl: 30d
  cookie:
    secure: ${USER_COOKIE_SECURE:true}
  oauth:
    success-redirect: ${USER_OAUTH_SUCCESS_REDIRECT}
    failure-redirect: ${USER_OAUTH_FAILURE_REDIRECT}
    enabled-providers: ${HOME_USER_OAUTH_ENABLED_PROVIDERS:google,kakao,naver}
  jwt:
    active-kid: ${USER_JWT_ACTIVE_KID}
    private-key-path: ${USER_JWT_PRIVATE_KEY_PATH}
    active-public-key-path: ${USER_JWT_ACTIVE_PUBLIC_KEY_PATH}
    overlap-kid: ${USER_JWT_OVERLAP_KID:}
    overlap-public-key-path: ${USER_JWT_OVERLAP_PUBLIC_KEY_PATH:}
    issuer: user-service
    audience: home-search-user-api
    lifetime: 15m

server:
  port: 8082
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: OAUTH_SESSION
        http-only: true
        secure: ${USER_COOKIE_SECURE:true}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
