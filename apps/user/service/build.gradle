plugins {
    id 'org.springframework.boot' version '3.5.7' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'com.home'
version = '0.0.1-SNAPSHOT'

allprojects {
    group = rootProject.group
    version = rootProject.version
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    dependencyManagement { imports { mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES } }
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    dependencies { testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
}

tasks.register('userServiceTest') {
    dependsOn ':core:test', ':api:test', ':migration:test'
}
