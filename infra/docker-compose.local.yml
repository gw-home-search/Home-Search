name: home-search-local

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: home-search-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HOME_SEARCH_DB_NAME:-home_search}
      POSTGRES_USER: ${HOME_SEARCH_DB_USERNAME:-home_search}
      POSTGRES_PASSWORD: ${HOME_SEARCH_DB_PASSWORD:?Set HOME_SEARCH_DB_PASSWORD}
      PROPERTY_RUNTIME_DB_PASSWORD: ${PROPERTY_RUNTIME_DB_PASSWORD:-property_runtime_local_password}
      PROPERTY_MIGRATOR_DB_PASSWORD: ${PROPERTY_MIGRATOR_DB_PASSWORD:?Set PROPERTY_MIGRATOR_DB_PASSWORD}
      AI_PROPERTY_READER_DB_PASSWORD: ${AI_PROPERTY_READER_DB_PASSWORD:?Set AI_PROPERTY_READER_DB_PASSWORD}
      AI_DATA_MIGRATOR_DB_PASSWORD: ${AI_DATA_MIGRATOR_DB_PASSWORD:?Set AI_DATA_MIGRATOR_DB_PASSWORD}
      AI_DATA_IMPORTER_DB_PASSWORD: ${AI_DATA_IMPORTER_DB_PASSWORD:?Set AI_DATA_IMPORTER_DB_PASSWORD}
      AI_DATA_RUNTIME_DB_PASSWORD: ${AI_DATA_RUNTIME_DB_PASSWORD:?Set AI_DATA_RUNTIME_DB_PASSWORD}
      ADMIN_RUNTIME_DB_PASSWORD: ${ADMIN_RUNTIME_DB_PASSWORD:-admin_runtime_local_password}
      ADMIN_MIGRATOR_DB_PASSWORD: ${ADMIN_MIGRATOR_DB_PASSWORD:-admin_migrator_local_password}
      USER_RUNTIME_DB_PASSWORD: ${USER_RUNTIME_DB_PASSWORD:?Set USER_RUNTIME_DB_PASSWORD}
      USER_MIGRATOR_DB_PASSWORD: ${USER_MIGRATOR_DB_PASSWORD:?Set USER_MIGRATOR_DB_PASSWORD}
    ports:
      - "127.0.0.1:${HOME_SEARCH_DB_PORT:-15432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - home-search-postgis-data:/var/lib/postgresql/data
      - ./postgres/init/10-create-service-databases-and-roles.sh:/docker-entrypoint-initdb.d/10-create-service-databases-and-roles.sh:ro
    networks:
      - home-search-local

  redis:
    image: redis:7.4-alpine
    container_name: home-search-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOME_SEARCH_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - home-search-local

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: home-search-ai-raw-minio
    restart: unless-stopped
    environment:
      HOME_AI_MINIO_ROOT_USER: ${HOME_AI_MINIO_ROOT_USER:?Set HOME_AI_MINIO_ROOT_USER}
      HOME_AI_MINIO_ROOT_PASSWORD: ${HOME_AI_MINIO_ROOT_PASSWORD:?Set HOME_AI_MINIO_ROOT_PASSWORD}
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - >-
        export MINIO_ROOT_USER="$${HOME_AI_MINIO_ROOT_USER:?HOME_AI_MINIO_ROOT_USER is required}";
        export MINIO_ROOT_PASSWORD="$${HOME_AI_MINIO_ROOT_PASSWORD:?HOME_AI_MINIO_ROOT_PASSWORD is required}";
        exec minio server /data --console-address ':9001'
    ports:
      - "127.0.0.1:${HOME_SEARCH_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${HOME_SEARCH_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - home-search-ai-raw-data:/data
    networks:
      - home-search-local

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: home-search-ai-raw-minio-init
    restart: "no"
    environment:
      HOME_AI_MINIO_ROOT_USER: ${HOME_AI_MINIO_ROOT_USER:?Set HOME_AI_MINIO_ROOT_USER}
      HOME_AI_MINIO_ROOT_PASSWORD: ${HOME_AI_MINIO_ROOT_PASSWORD:?Set HOME_AI_MINIO_ROOT_PASSWORD}
      HOME_AI_RAW_S3_BUCKET: ${HOME_AI_RAW_S3_BUCKET:?Set HOME_AI_RAW_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - >-
        : "$${HOME_AI_RAW_S3_BUCKET:?HOME_AI_RAW_S3_BUCKET is required}";
        : "$${HOME_AI_MINIO_ROOT_USER:?HOME_AI_MINIO_ROOT_USER is required}";
        : "$${HOME_AI_MINIO_ROOT_PASSWORD:?HOME_AI_MINIO_ROOT_PASSWORD is required}";
        : "$${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}";
        : "$${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}";
        case "$${HOME_AI_RAW_S3_BUCKET}" in ''|*[!a-z0-9.-]*) echo 'invalid raw bucket name' >&2; exit 2;; esac;
        [ "$${#HOME_AI_RAW_S3_BUCKET}" -ge 3 ] && [ "$${#HOME_AI_RAW_S3_BUCKET}" -le 63 ] || { echo 'invalid raw bucket length' >&2; exit 2; };
        mc alias set local http://minio:9000 "$${HOME_AI_MINIO_ROOT_USER}" "$${HOME_AI_MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing --with-lock "local/$${HOME_AI_RAW_S3_BUCKET}";
        mc version enable "local/$${HOME_AI_RAW_S3_BUCKET}";
        mc retention set --default GOVERNANCE 365d "local/$${HOME_AI_RAW_S3_BUCKET}";
        mc anonymous set none "local/$${HOME_AI_RAW_S3_BUCKET}";
        mc admin user add local "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}";
        printf '%s\n' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::'"$${HOME_AI_RAW_S3_BUCKET}"'/raw/*"]}]}' > /tmp/ai-raw-importer-policy.json;
        mc admin policy create local home-ai-raw-importer /tmp/ai-raw-importer-policy.json;
        mc admin policy attach local home-ai-raw-importer --user "$${AWS_ACCESS_KEY_ID}"
    networks:
      - home-search-local

  property-flyway:
    image: redgate/flyway:11.7.2
    platform: linux/amd64
    profiles: [ "migration" ]
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      FLYWAY_URL: ${PROPERTY_FLYWAY_URL:-jdbc:postgresql://postgis:5432/home_search}
      FLYWAY_USER: ${PROPERTY_FLYWAY_USER:-home_search_property_migrator}
      FLYWAY_PASSWORD: ${PROPERTY_MIGRATOR_DB_PASSWORD:?Set PROPERTY_MIGRATOR_DB_PASSWORD}
      REDGATE_DISABLE_TELEMETRY: "true"
    volumes:
      - ../apps/property-data/db/migration/api:/flyway/sql:ro
      - ../apps/property-data/db:/flyway/conf:ro
    networks:
      - home-search-local

  user-flyway:
    image: redgate/flyway:12.4.0
    platform: linux/amd64
    profiles: [ "migration" ]
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      FLYWAY_URL: ${USER_FLYWAY_URL:-jdbc:postgresql://postgis:5432/home_search_user}
      FLYWAY_USER: ${USER_FLYWAY_USER:-home_search_user_migrator}
      FLYWAY_PASSWORD: ${USER_MIGRATOR_DB_PASSWORD:?Set USER_MIGRATOR_DB_PASSWORD}
      REDGATE_DISABLE_TELEMETRY: "true"
    volumes:
      - ../apps/user/service/db/migration/user:/flyway/sql:ro
      - ../apps/user/service/db:/flyway/conf:ro
    networks:
      - home-search-local

  ml:
    build:
      context: ../apps/ml
      dockerfile: Dockerfile
    image: home-search-ml:local
    container_name: home-search-ml
    restart: unless-stopped
    environment:
      F37_ARTIFACT_DIR: /model
    ports:
      - "127.0.0.1:${HOME_SEARCH_ML_PORT:-8001}:8001"
    volumes:
      - ${F37_ARTIFACT_DIR:-/tmp/home-search-missing-f37-artifact}:/model:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=10)" ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - home-search-local

  api:
    image: eclipse-temurin:21-jdk
    container_name: home-search-api
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: [ "java", "-jar", "property-data-api.jar" ]
    env_file:
      - ../apps/property-data/ops/local-runtime.env.example
      - ${HOME_SEARCH_API_ENV_FILE:-../apps/property-data/ops/local-runtime.override.env.example}
      - ../apps/property-data/.env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_JDBC_URL: jdbc:postgresql://postgis:5432/${HOME_SEARCH_DB_NAME:-home_search}
      DB_USERNAME: ${PROPERTY_RUNTIME_DB_USERNAME:-home_search_property_runtime}
      DB_PASSWORD: ${PROPERTY_RUNTIME_DB_PASSWORD:-property_runtime_local_password}
      COORDINATE_SOURCE_DB_HOST: ${COORDINATE_SOURCE_DB_HOST:-home-search-coordinate-source-postgis-arm64-v4}
      COORDINATE_SOURCE_DB_NAME: ${COORDINATE_SOURCE_DB_NAME:-home_search_coordinate_source}
      COORDINATE_SOURCE_DB_JDBC_URL: ${COORDINATE_SOURCE_DB_JDBC_URL:-jdbc:postgresql://${COORDINATE_SOURCE_DB_HOST:-home-search-coordinate-source-postgis-arm64-v4}:5432/${COORDINATE_SOURCE_DB_NAME:-home_search_coordinate_source}}
      COORDINATE_SOURCE_DB_USERNAME: ${COORDINATE_SOURCE_DB_USERNAME:-home_search_coordinate_reader}
      COORDINATE_SOURCE_DB_PASSWORD: ${COORDINATE_SOURCE_DB_PASSWORD:-coordinate_reader_local_password}
      COORDINATE_SOURCE_DB_CONNECT_TIMEOUT_SECONDS: ${COORDINATE_SOURCE_DB_CONNECT_TIMEOUT_SECONDS:-5}
      COORDINATE_SOURCE_DB_SOCKET_TIMEOUT_SECONDS: ${COORDINATE_SOURCE_DB_SOCKET_TIMEOUT_SECONDS:-10}
      COORDINATE_SOURCE_DB_LOCK_TIMEOUT_MILLIS: ${COORDINATE_SOURCE_DB_LOCK_TIMEOUT_MILLIS:-1000}
      COORDINATE_SOURCE_DB_STATEMENT_TIMEOUT_MILLIS: ${COORDINATE_SOURCE_DB_STATEMENT_TIMEOUT_MILLIS:-3000}
      COORDINATE_SOURCE_DB_READ_ONLY: ${COORDINATE_SOURCE_DB_READ_ONLY:-true}
      HOME_INGEST_RTMS_ALLOW_COORDINATE_PENDING_ONLY: ${HOME_INGEST_RTMS_ALLOW_COORDINATE_PENDING_ONLY:-false}
      HOME_MAP_MARKER_CACHE_ENABLED: ${HOME_MAP_MARKER_CACHE_ENABLED:-false}
      HOME_MAP_MARKER_CACHE_TTL: ${HOME_MAP_MARKER_CACHE_TTL:-5m}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      HOME_PLACE_KAKAO_ENABLED: ${HOME_PLACE_KAKAO_ENABLED:-false}
      HOME_PLACE_KAKAO_CACHE_ENABLED: ${HOME_PLACE_KAKAO_CACHE_ENABLED:-true}
      HOME_PLACE_KAKAO_CACHE_TTL: ${HOME_PLACE_KAKAO_CACHE_TTL:-24h}
      HOME_PLACE_KAKAO_VIEWPORT_CACHE_TTL: ${HOME_PLACE_KAKAO_VIEWPORT_CACHE_TTL:-1h}
      HOME_PLACE_KAKAO_DAILY_REQUEST_BUDGET: ${HOME_PLACE_KAKAO_DAILY_REQUEST_BUDGET:-10000}
      HOME_PLACE_KAKAO_CONNECT_TIMEOUT: ${HOME_PLACE_KAKAO_CONNECT_TIMEOUT:-1s}
      HOME_PLACE_KAKAO_READ_TIMEOUT: ${HOME_PLACE_KAKAO_READ_TIMEOUT:-2s}
      HOME_PLACE_KAKAO_EXECUTOR_THREADS: ${HOME_PLACE_KAKAO_EXECUTOR_THREADS:-4}
      HOME_PREDICTION_ENABLED: ${HOME_PREDICTION_ENABLED:-true}
      HOME_PREDICTION_CLIENT_BASE_URL: ${HOME_PREDICTION_CLIENT_BASE_URL:-http://ml:8001}
      HOME_PREDICTION_CACHE_TTL: ${HOME_PREDICTION_CACHE_TTL:-24h}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      HOME_ADMIN_INTERNAL_ENABLED: "true"
      HOME_ADMIN_INTERNAL_ISSUER: admin-service
      HOME_ADMIN_INTERNAL_AUDIENCE: property-data-admin
      HOME_ADMIN_INTERNAL_MAXIMUM_LIFETIME: 60s
      HOME_ADMIN_INTERNAL_PUBLIC_KEYS: ${ADMIN_INTERNAL_JWT_KEY_ID:-local-2026-07}=/run/keys/admin-internal-public
      SERVER_PORT: "8080"
    expose:
      - "8080"
    volumes:
      - ../apps/property-data/api/build/libs/property-data-api.jar:/app/property-data-api.jar:ro
      - ../runtime-keys/admin-internal/public:/run/keys/admin-internal-public:ro
    networks:
      - home-search-local

  public-api-gateway:
    image: nginx:1.27-alpine
    container_name: home-search-public-api-gateway
    restart: unless-stopped
    depends_on:
      - api
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${HOME_SEARCH_API_PORT:-8080}:8080"
    volumes:
      - ./nginx/property-public.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - home-search-local

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: home-search-prometheus
    restart: unless-stopped
    depends_on:
      - api
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${HOME_SEARCH_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - home-search-prometheus-data:/prometheus
    networks:
      - home-search-local

  loki:
    image: grafana/loki:3.7.0
    container_name: home-search-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/local-config.yml"
    ports:
      - "127.0.0.1:${HOME_SEARCH_LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki.local.yml:/etc/loki/local-config.yml:ro
      - home-search-loki-data:/loki
    networks:
      - home-search-local

  alloy:
    image: grafana/alloy:${HOME_SEARCH_ALLOY_IMAGE_TAG:-v${HOME_SEARCH_ALLOY_VERSION:-1.16.3}}
    container_name: home-search-alloy
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
    ports:
      - "127.0.0.1:${HOME_SEARCH_ALLOY_PORT:-12345}:12345"
    volumes:
      - ./alloy.local.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - home-search-alloy-data:/var/lib/alloy/data
    networks:
      - home-search-local

  grafana:
    image: grafana/grafana:13.0.2
    container_name: home-search-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${HOME_SEARCH_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${HOME_SEARCH_GRAFANA_ADMIN_PASSWORD:-home_search_local_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${HOME_SEARCH_GRAFANA_ANONYMOUS_ENABLED:-false}
    ports:
      - "127.0.0.1:${HOME_SEARCH_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - home-search-grafana-data:/var/lib/grafana
    networks:
      - home-search-local

  web:
    image: node:22-bookworm-slim
    container_name: home-search-web
    restart: unless-stopped
    depends_on:
      - api
    working_dir: /workspace/apps/web
    env_file:
      - ../apps/web/.env
    command:
      - sh
      - -c
      - >-
        test -n "$$VITE_KAKAO_MAP_APP_KEY" ||
        { printf '%s\n' 'VITE_KAKAO_MAP_APP_KEY is required' >&2; exit 2; };
        npm ci && npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_SERVER_IP: ${VITE_API_SERVER_IP:-http://localhost:8080}
      VITE_USER_API_SERVER_IP: ${VITE_USER_API_SERVER_IP:-http://localhost:8082}
    ports:
      - "${HOME_SEARCH_WEB_PORT:-5173}:5173"
    volumes:
      - ../apps/web:/workspace/apps/web
      - home-search-web-node-modules:/workspace/apps/web/node_modules
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173/', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - home-search-local

  admin-service:
    image: eclipse-temurin:21-jdk
    container_name: home-search-admin-service
    restart: unless-stopped
    profiles: [ "admin" ]
    depends_on:
      postgis:
        condition: service_healthy
    working_dir: /app
    command: [ "java", "-jar", "admin-service-api.jar" ]
    environment:
      ADMIN_DB_JDBC_URL: jdbc:postgresql://postgis:5432/home_search_admin
      ADMIN_DB_USERNAME: ${ADMIN_RUNTIME_DB_USERNAME:-home_search_admin_runtime}
      ADMIN_DB_PASSWORD: ${ADMIN_RUNTIME_DB_PASSWORD:-admin_runtime_local_password}
      ADMIN_INTERNAL_ENABLED: "true"
      ADMIN_INTERNAL_JWT_ISSUER: admin-service
      ADMIN_INTERNAL_JWT_AUDIENCE: property-data-admin
      ADMIN_INTERNAL_JWT_LIFETIME: 60s
      ADMIN_INTERNAL_JWT_KEY_ID: ${ADMIN_INTERNAL_JWT_KEY_ID:-local-2026-07}
      ADMIN_INTERNAL_JWT_PRIVATE_KEY_PATH: /run/keys/admin-internal-signing
      PROPERTY_DATA_INTERNAL_BASE_URL: http://api:8080
      SERVER_PORT: "8081"
    ports:
      - "${HOME_SEARCH_ADMIN_API_PORT:-8081}:8081"
    volumes:
      - ../apps/admin/service/api/build/libs/admin-service-api.jar:/app/admin-service-api.jar:ro
      - ../runtime-keys/admin-internal/private:/run/keys/admin-internal-signing:ro
    networks:
      - home-search-local

  admin-web:
    image: node:22-bookworm-slim
    container_name: home-search-admin-web
    restart: unless-stopped
    profiles: [ "admin" ]
    depends_on:
      - admin-service
    working_dir: /workspace/apps/admin/web
    command: [ "sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5174" ]
    environment:
      ADMIN_SERVICE_PROXY_TARGET: http://admin-service:8081
    ports:
      - "${HOME_SEARCH_ADMIN_WEB_PORT:-5174}:5174"
    volumes:
      - ../apps/admin/web:/workspace/apps/admin/web
      - home-search-admin-web-node-modules:/workspace/apps/admin/web/node_modules
    networks:
      - home-search-local

  user-service:
    image: eclipse-temurin:21-jdk
    container_name: home-search-user-service
    restart: unless-stopped
    profiles: [ "user" ]
    env_file:
      - ../apps/user/service/.env
    depends_on:
      postgis:
        condition: service_healthy
    working_dir: /app
    command: [ "java", "-jar", "user-service-app.jar" ]
    environment:
      USER_DB_JDBC_URL: jdbc:postgresql://postgis:5432/home_search_user
      USER_DB_USERNAME: home_search_user_runtime
      SPRING_PROFILES_ACTIVE: local
      USER_JWT_PRIVATE_KEY_PATH: /run/keys/user-signing-private
      USER_JWT_ACTIVE_PUBLIC_KEY_PATH: /run/keys/user-signing-public
      SERVER_PORT: "8082"
    ports:
      - "${HOME_SEARCH_USER_API_PORT:-8082}:8082"
    volumes:
      - ../apps/user/service/app/build/libs/user-service-app.jar:/app/user-service-app.jar:ro
      - ${USER_JWT_PRIVATE_KEY_HOST_PATH:-../runtime-keys/user/private}:/run/keys/user-signing-private:ro
      - ${USER_JWT_PUBLIC_KEY_HOST_PATH:-../runtime-keys/user/public}:/run/keys/user-signing-public:ro
    networks:
      - home-search-local

volumes:
  home-search-postgis-data:
  home-search-ai-raw-data:
  home-search-gradle-cache:
  home-search-prometheus-data:
  home-search-loki-data:
  home-search-alloy-data:
  home-search-grafana-data:
  home-search-web-node-modules:
  home-search-admin-web-node-modules:

networks:
  home-search-local:
