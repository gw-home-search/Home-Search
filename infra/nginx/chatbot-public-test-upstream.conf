server {
    listen 8083;
    server_name _;

    location = /api/v1/chatbot/query {
        default_type application/json;
        return 200 '{"upstream":"chat-bff-json","requestId":"$http_x_request_id"}';
    }

    location = /api/v1/chatbot/query/stream {
        default_type text/event-stream;
        add_header Cache-Control "no-cache";
        return 200 'event: final\ndata: {"upstream":"chat-bff-sse","requestId":"$http_x_request_id"}\n\n';
    }
}
