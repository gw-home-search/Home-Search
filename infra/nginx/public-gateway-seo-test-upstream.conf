server {
    listen 3000;
    server_name _;

    location = /robots.txt { default_type text/plain; return 200 'User-agent: *\nSitemap: https://homesearch.world/sitemap.xml\n'; }
    location = /sitemap.xml { default_type application/xml; return 200 '<?xml version="1.0"?><sitemapindex></sitemapindex>'; }
    location = /sitemaps/pages.xml { default_type application/xml; return 200 '<?xml version="1.0"?><urlset></urlset>'; }
    location = /complexes/999 { add_header X-Robots-Tag 'noindex, nofollow' always; return 404; }
    location ~ ^/(?:privacy|terms|about)$ {
        default_type text/html;
        add_header X-Robots-Tag 'index, follow' always;
        return 200 '<!doctype html><html lang="ko"><head><title>Public document fixture</title></head><body>public-document</body></html>';
    }
    location ~ ^/(?:complexes|regions)/[1-9][0-9]*$ {
        default_type text/html;
        add_header X-Robots-Tag 'index, follow' always;
        return 200 '<!doctype html><html lang="ko"><head><title>SEO fixture</title></head><body>same-for-every-user-agent</body></html>';
    }
}
