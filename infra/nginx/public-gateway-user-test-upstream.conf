server {
    listen 8080;
    server_name _;

    location = /oauth2/authorization/kakao {
        default_type application/json;
        return 200 '{"upstream":"user","forwardedProto":"$http_x_forwarded_proto","host":"$http_host"}';
    }

    location = /api/v1/insights/subscription {
        if ($http_authorization = "") {
            return 401;
        }
        default_type application/json;
        return 200 '{"upstream":"user"}';
    }

    location = /api/v1/insights/inbox {
        if ($http_authorization = "") {
            return 401;
        }
        default_type application/json;
        return 200 '{"upstream":"user"}';
    }

    location / {
        default_type application/json;
        return 200 '{"upstream":"user"}';
    }
}
